<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IJzerlog · Basic Fit tracker</title>
<meta name="theme-color" content="#14151a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<script>
  // localStorage-shim met dezelfde async API als de Claude artifact-opslag,
  // zodat de rest van de app ongewijzigd blijft.
  window.storage = {
    async get(key){
      const v = localStorage.getItem(key);
      if(v === null) throw new Error('key not found: ' + key);
      return {key, value:v};
    },
    async set(key, value){
      localStorage.setItem(key, value);
      return {key, value};
    },
    async delete(key){
      localStorage.removeItem(key);
      return {key, deleted:true};
    },
    async list(prefix){
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return {keys};
    }
  };
</script>

<!--
  Design read (taste-skill 0.B, adapted for a daily-use data tool rather than a landing page):
  a personal strength-training log, checked briefly once or twice a day at the gym, leaning toward
  a dark gym-chalk / "cockpit" language. VISUAL_DENSITY dial pushed toward 6-7 (cockpit): numeric
  readouts (weight, sets, reps, machine no.) use a monospace font so digits align like a real gauge,
  Barlow Condensed stays for headings/names, Inter for body. Accent tempered from a neon #c6f135 to
  a less-saturated #a8d94a (still clearly lime, less searing on-screen), per taste-skill 4.2's
  saturation guidance. Motion restrained per emil-design-eng: opened tens of times a week, so nothing
  animates just to look good; motion only serves state feedback (expand/collapse, press, progress fill).
-->
<style>
  :root{
    --bg:#14151a;
    --surface:#1c1f26;
    --surface-2:#242832;
    --border:#333844;
    --text:#ece9e2;
    --text-dim:#9aa0ab;
    --accent:#a8d94a;
    --accent-dim:#8bb83f;
    --warn:#ff7a45;
    --radius:10px;
    --ease-out:cubic-bezier(0.23,1,0.32,1);
    --ease-in-out:cubic-bezier(0.77,0,0.175,1);
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:20px 16px 60px;
    max-width:720px;
    margin:0 auto;
  }
  h1,h2,h3{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:0.02em;margin:0;}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px;border-bottom:1px solid var(--border);padding-bottom:16px;}
  header .brand{display:flex;align-items:center;gap:10px;}
  header h1{font-size:28px;font-weight:800;color:var(--text);}
  header .sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .barbell{width:34px;height:34px;flex-shrink:0;}
  #status{font-size:11px;color:var(--text-dim);text-align:right;}

  .exercise-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    margin-bottom:12px;
    overflow:hidden;
  }
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    cursor:pointer;
    gap:10px;
  }
  .card-head:hover{background:var(--surface-2);}
  .card-title{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .card-title .name{font-size:16px;font-weight:700;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:0.01em;}
  .card-title .meta{font-size:12px;color:var(--text-dim);display:flex;gap:8px;flex-wrap:wrap;}
  .machine-tag{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:5px;
    padding:1px 6px;
    font-size:11px;
    color:var(--text-dim);
  }
  .card-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .weight-now{font-family:var(--font-mono);font-size:21px;font-weight:700;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .weight-now span{font-size:12px;color:var(--text-dim);font-family:'Inter',sans-serif;font-weight:500;}
  .chev{transition:transform 200ms var(--ease-in-out);color:var(--text-dim);}
  .exercise-card.open .chev{transform:rotate(180deg);}

  .plate-bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px;width:100%;}
  .plate-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width 300ms var(--ease-out);}

  /* grid-rows trick: animates height without measuring it in JS, stays interruptible (CSS transition, not keyframes) */
  .card-body-wrap{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows 200ms var(--ease-in-out);
  }
  .exercise-card.open .card-body-wrap{grid-template-rows:1fr;}
  .card-body{
    min-height:0;
    overflow:hidden;
    padding:0 16px 16px;
    border-top:1px solid var(--border);
    opacity:0;
    transition:opacity 160ms var(--ease-out);
  }
  .exercise-card.open .card-body{opacity:1;transition:opacity 200ms var(--ease-out) 60ms;}

  @media (prefers-reduced-motion: reduce){
    .chev,.plate-bar-fill,.card-body-wrap,.card-body,button{transition-duration:0ms !important;}
  }

  .suggestion{
    margin:14px 0 10px;
    padding:10px 12px;
    border-radius:8px;
    font-size:13px;
    line-height:1.4;
    display:flex;
    gap:8px;
    align-items:flex-start;
  }
  .suggestion.up{background:rgba(168,217,74,0.10);border:1px solid rgba(168,217,74,0.4);color:var(--accent);}
  .suggestion.hold{background:rgba(255,122,69,0.08);border:1px solid rgba(255,122,69,0.35);color:var(--warn);}
  .suggestion.none{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);}
  .technique-tip{display:inline-block;margin-top:4px;opacity:0.75;}

  table.log-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
  table.log-table th{text-align:left;color:var(--text-dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.03em;padding:4px 6px;border-bottom:1px solid var(--border);}
  table.log-table td{padding:6px 6px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  table.log-table td:first-child{font-family:'Inter',sans-serif;}
  table.log-table tbody tr:nth-child(even) td{background:var(--surface-2);}
  table.log-table tbody tr:first-child td{border-radius:6px 6px 0 0;}
  table.log-table tbody tr:last-child td{border-radius:0 0 6px 6px;}
  .weight-pr{color:var(--accent);font-weight:700;}
  .row-del-cell{width:1%;text-align:right;padding-right:2px !important;}
  .row-del{padding:2px 7px;font-size:14px;line-height:1;color:var(--text-dim);border-color:transparent;background:transparent;}
  .row-del:hover{color:var(--warn);border-color:var(--warn);background:rgba(255,122,69,0.08);}

  canvas.chart{margin-top:14px;max-height:180px;}

  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:70px;}
  .field label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.03em;}
  input,textarea{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:6px;
    padding:8px 9px;
    font-size:14px;
    font-family:inherit;
    width:100%;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--accent);}
  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    border-radius:7px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    padding:9px 14px;
    cursor:pointer;
    transition:transform 160ms var(--ease-out), border-color 160ms var(--ease-out), background 160ms var(--ease-out);
  }
  @media (hover:hover) and (pointer:fine){
    button:hover{border-color:var(--accent);}
    button.primary:hover{background:var(--accent-dim);border-color:var(--accent-dim);}
  }
  button:active{transform:scale(0.97);}
  button.primary{background:var(--accent);color:#14151a;border-color:var(--accent);}
  button.ghost{background:transparent;border-color:transparent;color:var(--text-dim);padding:6px 8px;}
  .actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;}
  .settings-toggle{font-size:11px;color:var(--text-dim);cursor:pointer;text-decoration:underline;margin-top:10px;display:inline-block;}
  .settings-row{display:none;gap:8px;margin-top:8px;}
  .settings-row.open{display:flex;flex-wrap:wrap;}

  .top-tip{
    display:flex;
    align-items:baseline;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:8px;
    padding:10px 14px;
    margin-bottom:16px;
    font-size:13px;
    color:var(--text);
    line-height:1.4;
  }
  .top-tip-label{
    font-family:'Barlow Condensed',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-size:11px;
    color:var(--accent);
    font-weight:700;
    flex-shrink:0;
  }

  .add-exercise{
    background:var(--surface);
    border:1px dashed var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-top:18px;
  }
  .add-exercise h3{font-size:14px;color:var(--text-dim);margin-bottom:8px;}
  .empty{color:var(--text-dim);font-size:13px;padding:20px;text-align:center;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="barbell" viewBox="0 0 48 48" fill="none">
      <rect x="4" y="18" width="6" height="12" rx="1.5" fill="var(--accent)"/>
      <rect x="10" y="14" width="4" height="20" rx="1.5" fill="var(--accent)"/>
      <rect x="14" y="21" width="20" height="6" rx="2" fill="var(--text)"/>
      <rect x="34" y="14" width="4" height="20" rx="1.5" fill="var(--accent)"/>
      <rect x="38" y="18" width="6" height="12" rx="1.5" fill="var(--accent)"/>
    </svg>
    <div>
      <h1>IJzerlog</h1>
      <div class="sub">Basic Fit Hilversum · progressie sinds aug 2025</div>
    </div>
  </div>
  <div id="status"></div>
</header>

<div id="top-tip" class="top-tip" style="display:none;">
  <span class="top-tip-label">Focus</span>
  <span id="top-tip-text"></span>
</div>

<div id="list"></div>

<div class="add-exercise">
  <h3>Nieuwe oefening toevoegen</h3>
  <div class="row">
    <div class="field" style="flex:2;min-width:140px;">
      <label>Naam</label>
      <input id="new-ex-name" placeholder="bv. triceps press">
    </div>
    <div class="field">
      <label>Toestelnr.</label>
      <input id="new-ex-machine" placeholder="bv. 27">
    </div>
    <div class="field">
      <label>Stap (kg)</label>
      <input id="new-ex-increment" type="number" step="0.5" value="2.5">
    </div>
    <div class="field">
      <label>Spiergroep (optioneel)</label>
      <input id="new-ex-muscle" placeholder="bv. hamstrings">
    </div>
  </div>
  <div class="actions">
    <button class="primary" id="add-ex-btn">Toevoegen</button>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY_EX = 'basicfit-exercises-v1';
  const STORAGE_KEY_LOGS = 'basicfit-logs-v1';

  const seedExercises = [
    {id:'seated-dip', name:'Seated dip', machine:'52', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'triceps/borst'},
    {id:'back-extension', name:'Back extension', machine:'43', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'onderrug'},
    {id:'fly', name:'Fly', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'borst'},
    {id:'shoulder-press', name:'Shoulder press', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'schouders'},
    {id:'abdominal-crunch', name:'Abdominal crunch', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'buik'},
    {id:'perfect-squat', name:'Perfect squat', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'quadriceps'},
    {id:'leg-extension', name:'Leg extension', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'quadriceps'},
    {id:'leg-press', name:'Leg press', machine:'53', increment:5, targetReps:8, targetSets:3, muscleGroup:'quadriceps/bilspieren'},
    {id:'diverging-lat-pulldown', name:'Diverging lat pulldown', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'rug'},
    {id:'chest-press', name:'Chest press', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'borst'},
    {id:'lateral-raise', name:'Lateral raise', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'schouders'},
    {id:'squat', name:'Squat', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'quadriceps'},
    {id:'lat-pulldown', name:'Lat pulldown', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'rug'},
    {id:'cable-fly', name:'Cable fly', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'borst'},
    {id:'leg-curl', name:'Leg curl', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'hamstrings'},
    {id:'calf-raise', name:'Calf raise', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'kuiten'},
  ];

  // id -> muscleGroup, gebruikt om ontbrekende tags in bestaande (al opgeslagen) data aan te vullen
  const muscleGroupById = {};
  seedExercises.forEach(e => { muscleGroupById[e.id] = e.muscleGroup; });

  // Eén korte, oefeningspecifieke uitvoeringscue (geen volledige les, gewoon het
  // belangrijkste aandachtspunt) — zodat de suggestiebox niet bij elke oefening
  // hetzelfde generieke zinnetje toont.
  const techniqueTips = {
    'seated-dip': 'Buig niet te ver naar voren; romp rechtop houden voor triceps-focus.',
    'back-extension': 'Gecontroleerd bewegen, niet doorzwiepen; strek de heup niet voorbij een rechte lijn.',
    'fly': 'Lichte buiging in de ellebogen, beweeg vanuit de schouders, niet vanuit de onderarmen.',
    'shoulder-press': 'Druk recht omhoog, niet naar voren; hol je onderrug niet.',
    'abdominal-crunch': 'Kleine, gecontroleerde beweging vanuit de buik, geen momentum uit de heupen.',
    'perfect-squat': 'Onderrug tegen de rugsteun, knieën in lijn met de tenen, tot dijen evenwijdig aan de vloer.',
    'leg-extension': 'Gecontroleerd strekken, niet doorzwaaien bovenaan, net zo langzaam weer terug.',
    'leg-press': 'Voeten schouderbreedte op de plaat; knieën bovenaan niet volledig doorstrekken/blokkeren.',
    'diverging-lat-pulldown': 'Ellebogen naar beneden én naar achteren, borst vooruit; laat de terugbeweging niet ongecontroleerd gaan.',
    'chest-press': 'Schouderbladen naar achteren en beneden; polsen recht boven de ellebogen.',
    'lateral-raise': 'Til tot schouderhoogte, niet hoger, en zwaai het gewicht niet omhoog.',
    'squat': 'Knieën in lijn met de tenen, borst omhoog, tot dijen evenwijdig aan de vloer.',
    'lat-pulldown': 'Trek naar je bovenborst, niet achter je nek; niet achterover leunen.',
    'cable-fly': 'Lichte buiging in de ellebogen, beweeg in een boog voor de borst, geen persbeweging.',
    'leg-curl': 'Heupen op de pad houden, buig alleen vanuit de knie, geen momentum.',
    'calf-raise': 'Volledige rek onderaan, korte pauze bovenaan, gecontroleerd zakken.',
  };

  // Nieuwe standaardoefeningen die aan een bestaande, al opgeslagen lijst worden toegevoegd
  // (de seedExercises hierboven worden alleen gebruikt bij een compleet lege/nieuwe installatie)
  const exercisesToBackfill = [
    {id:'leg-curl', name:'Leg curl', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'hamstrings'},
    {id:'calf-raise', name:'Calf raise', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'kuiten'},
  ];

  // date, weight, sets/reps unknown for historical import (sheet only tracked weight)
  const seedLogs = [
    ['seated-dip',[['2025-08-24',68],['2025-09-01',68],['2025-09-08',73],['2025-09-21',73],['2025-09-23',73]]],
    ['back-extension',[['2025-08-24',79],['2025-09-01',86],['2025-09-08',93],['2025-09-21',93],['2025-09-23',100]]],
    ['fly',[['2025-08-24',93],['2025-09-01',100],['2025-09-08',100],['2025-09-23',100]]],
    ['shoulder-press',[['2025-08-24',23],['2025-09-01',27],['2025-09-08',32],['2025-09-21',36]]],
    ['abdominal-crunch',[['2025-08-24',68],['2025-09-01',73],['2025-09-08',77],['2025-09-21',77]]],
    ['perfect-squat',[['2025-08-24',40],['2025-09-01',40],['2025-09-08',50]]],
    ['leg-extension',[['2025-08-24',86],['2025-09-01',86],['2025-09-08',86],['2025-09-23',73]]],
    ['leg-press',[['2025-08-24',107],['2025-09-01',113],['2025-09-23',113]]],
    ['diverging-lat-pulldown',[['2025-08-24',52],['2025-09-01',52],['2025-09-08',59]]],
    ['chest-press',[['2025-08-24',39],['2025-09-01',39],['2025-09-23',45]]],
    ['lateral-raise',[['2025-09-01',32],['2025-09-08',36],['2025-09-23',41]]],
    ['squat',[['2025-08-24',40],['2025-09-01',40],['2025-09-08',50],['2025-09-21',50]]],
    ['lat-pulldown',[['2025-08-24',52],['2025-09-01',52],['2025-09-08',52],['2025-09-21',52]]],
    ['cable-fly',[['2025-09-01',18]]],
  ];

  function buildSeedLogs(){
    const logs = [];
    let counter = 1;
    seedLogs.forEach(([exId, entries]) => {
      entries.forEach(([date, weight]) => {
        logs.push({id:'seed-'+counter++, exerciseId:exId, date, weight, sets:null, reps:null, machine:null, note:''});
      });
    });
    return logs;
  }

  let exercises = [];
  let logs = [];
  let openCards = {};
  let charts = {};

  function setStatus(msg){
    document.getElementById('status').textContent = msg;
  }

  async function loadAll(){
    setStatus('laden…');
    try{
      const exRes = await window.storage.get(STORAGE_KEY_EX);
      exercises = exRes ? JSON.parse(exRes.value) : null;
    }catch(e){ exercises = null; }
    try{
      const logRes = await window.storage.get(STORAGE_KEY_LOGS);
      logs = logRes ? JSON.parse(logRes.value) : null;
    }catch(e){ logs = null; }

    let needSave = false;
    if(!exercises){ exercises = seedExercises; needSave = true; }
    if(!logs){ logs = buildSeedLogs(); needSave = true; }

    if(needSave){
      await saveExercises();
      await saveLogs();
    }

    if(await migrate()){
      await saveExercises();
    }
    setStatus('opgeslagen');
    render();
  }

  // Eenmalige/idempotente opschoning voor een AL bestaande installatie (data staat al in
  // localStorage op de telefoon): nieuwe standaardoefeningen toevoegen als ze nog niet
  // bestaan, spiergroep-labels aanvullen op bestaande oefeningen, en het oude reps-doel
  // van 12 (hypertrofie-achtig) eenmalig verlagen naar 8 (meer kracht/progressive-overload
  // gericht) zonder een eventuele eigen aanpassing van Jasper te overschrijven.
  async function migrate(){
    let changed = false;

    exercisesToBackfill.forEach(def => {
      if(!exercises.find(e => e.id === def.id)){
        exercises.push({...def});
        changed = true;
      }
    });

    exercises.forEach(e => {
      if(!e.muscleGroup && muscleGroupById[e.id]){
        e.muscleGroup = muscleGroupById[e.id];
        changed = true;
      }
    });

    let repsMigrated = false;
    try{
      const flag = await window.storage.get('basicfit-migration-reps8-v1');
      repsMigrated = flag.value === 'done';
    }catch(e){ repsMigrated = false; }
    if(!repsMigrated){
      exercises.forEach(e => {
        if(e.targetReps === 12){ e.targetReps = 8; changed = true; }
      });
      await window.storage.set('basicfit-migration-reps8-v1', 'done');
    }

    return changed;
  }

  async function saveExercises(){
    try{
      await window.storage.set(STORAGE_KEY_EX, JSON.stringify(exercises));
    }catch(e){ console.error('opslaan mislukt', e); setStatus('opslaan mislukt'); }
  }
  async function saveLogs(){
    try{
      await window.storage.set(STORAGE_KEY_LOGS, JSON.stringify(logs));
    }catch(e){ console.error('opslaan mislukt', e); setStatus('opslaan mislukt'); }
  }

  function logsFor(exId){
    return logs.filter(l => l.exerciseId === exId).sort((a,b)=> a.date.localeCompare(b.date));
  }

  function latestLog(exId){
    const l = logsFor(exId);
    return l.length ? l[l.length-1] : null;
  }

  // Alleen een écht nieuw record: strikt zwaarder dan alles ervoor (dus geen "PR" meer
  // bij een herhaling van je huidige max, en de allereerste log ooit telt niet mee
  // want die verbetert nog niets).
  function isPR(exId, log){
    const before = logsFor(exId).filter(l => l.date < log.date);
    if(before.length === 0) return false;
    return before.every(l => l.weight < log.weight);
  }

  function suggestionFor(ex){
    const last = latestLog(ex.id);
    if(!last) return {type:'none', text:'Nog geen data. Log je eerste sessie.'};
    if(last.reps == null || last.sets == null){
      const next = (last.weight + ex.increment).toFixed(1).replace(/\.0$/,'');
      return {type:'none', text:'Geen reps/sets gelogd. Vuistregel voor progressieve overbelasting: ging ' + last.weight + ' kg goed, probeer deze keer ' + next + ' kg. Log ook reps/sets voor een preciezere tip.'};
    }
    if(last.reps >= ex.targetReps){
      const next = (last.weight + ex.increment).toFixed(1).replace(/\.0$/,'');
      return {type:'up', text:'Alle sets op ' + ex.targetReps + '+ reps. Probeer volgende keer ' + next + ' kg.'};
    }else{
      return {type:'hold', text:'Nog niet op ' + ex.targetReps + ' reps. Blijf op ' + last.weight + ' kg en focus op reps.'};
    }
  }

  function pctChange(exId){
    const l = logsFor(exId);
    if(l.length < 2) return null;
    const first = l[0].weight, last = l[l.length-1].weight;
    if(!first) return null;
    return ((last - first) / first) * 100;
  }

  function fmtDate(d){
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('nl-NL', {day:'2-digit', month:'short'});
  }

  // Kijkt over ALLE oefeningen heen (niet per kaart) welke spiergroep het langst geleden
  // (of nog nooit) getraind is, en stelt daar één concrete oefening voor. Groepen als
  // 'quadriceps/bilspieren' worden samengevoegd onder hun eerste woord ('quadriceps') zodat
  // verwante machines meetellen. Blijft stil (geen tip) zolang er geen echte achterstand is,
  // zodat het geen ruis wordt als je redelijk gelijkmatig traint.
  function computeTopTip(){
    const todayD = new Date(todayStr() + 'T00:00:00');
    const groups = {};
    exercises.forEach(ex => {
      if(!ex.muscleGroup) return;
      const key = ex.muscleGroup.split('/')[0].trim().toLowerCase();
      const exLogs = logsFor(ex.id);
      const lastDate = exLogs.length ? exLogs[exLogs.length - 1].date : null;
      if(!groups[key]) groups[key] = { lastDate: null, exercises: [] };
      groups[key].exercises.push({ name: ex.name, logCount: exLogs.length });
      if(lastDate && (!groups[key].lastDate || lastDate > groups[key].lastDate)){
        groups[key].lastDate = lastDate;
      }
    });

    let worstKey = null, worstDays = -1;
    Object.keys(groups).forEach(key => {
      const g = groups[key];
      const days = g.lastDate
        ? Math.round((todayD - new Date(g.lastDate + 'T00:00:00')) / 86400000)
        : Infinity;
      if(days > worstDays){ worstDays = days; worstKey = key; }
    });

    if(!worstKey || worstDays < 10) return null;

    const g = groups[worstKey];
    const target = g.exercises.slice().sort((a, b) => a.logCount - b.logCount)[0];
    const label = worstKey.charAt(0).toUpperCase() + worstKey.slice(1);
    const whenText = worstDays === Infinity ? 'nog nooit getraind' : worstDays + ' dagen niet getraind';
    return label + ' ' + whenText + '. Misschien een moment voor ' + target.name + ' de komende sessie.';
  }

  function renderTopTip(){
    const el = document.getElementById('top-tip');
    const textEl = document.getElementById('top-tip-text');
    const tip = computeTopTip();
    if(!tip){ el.style.display = 'none'; return; }
    textEl.textContent = tip;
    el.style.display = 'flex';
  }

  function render(){
    renderTopTip();
    const list = document.getElementById('list');
    list.innerHTML = '';
    if(exercises.length === 0){
      list.innerHTML = '<div class="empty">Nog geen oefeningen. Voeg er een toe hieronder.</div>';
      return;
    }
    const sorted = [...exercises].sort((a, b) => a.name.localeCompare(b.name, 'nl', {sensitivity:'base'}));
    sorted.forEach(ex => {
      const card = document.createElement('div');
      card.className = 'exercise-card' + (openCards[ex.id] ? ' open' : '');
      card.dataset.exId = ex.id;

      const last = latestLog(ex.id);
      const pct = pctChange(ex.id);
      const pctBarWidth = pct != null ? Math.min(Math.max(pct, 0), 100) : 0;

      card.innerHTML = `
        <div class="card-head" data-toggle="${ex.id}">
          <div class="card-title">
            <div class="name">${escapeHtml(ex.name)}</div>
            <div class="meta">
              ${ex.muscleGroup ? `<span>${escapeHtml(ex.muscleGroup)}</span>` : ''}
              ${ex.machine ? `<span class="machine-tag">${escapeHtml(ex.machine)}</span>` : ''}
              ${last ? `<span>${fmtDate(last.date)}</span>` : '<span>geen sessies</span>'}
              ${pct != null ? `<span>${pct >= 0 ? '+' : ''}${pct.toFixed(0)}% sinds start</span>` : ''}
            </div>
            <div class="plate-bar"><div class="plate-bar-fill" style="width:${pctBarWidth}%"></div></div>
          </div>
          <div class="card-right">
            <div class="weight-now">${last ? last.weight : '–'}<span> kg</span></div>
            <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
        <div class="card-body-wrap"><div class="card-body">
          ${renderSuggestion(ex)}
          <canvas class="chart" id="chart-${ex.id}" height="60"></canvas>
          ${renderLogTable(ex)}
          <div class="row">
            <div class="field"><label>Datum</label><input type="date" id="in-date-${ex.id}" value="${todayStr()}"></div>
            <div class="field"><label>Gewicht (kg)</label><input type="number" step="0.5" id="in-weight-${ex.id}" value="${last ? last.weight : ''}"></div>
            <div class="field"><label>Sets</label><input type="number" id="in-sets-${ex.id}" value="${ex.targetSets}"></div>
            <div class="field"><label>Reps</label><input type="number" id="in-reps-${ex.id}" value=""></div>
          </div>
          <div class="row">
            <div class="field" style="flex:2;"><label>Toestelnr. (optioneel)</label><input id="in-machine-${ex.id}" value="${ex.machine || ''}"></div>
            <div class="field" style="flex:2;"><label>Notitie</label><input id="in-note-${ex.id}" placeholder="bv. zwaar, tempo, pijntje"></div>
          </div>
          <div class="actions">
            <button class="ghost" data-delete-ex="${ex.id}">Oefening verwijderen</button>
            <button class="primary" data-save-log="${ex.id}">Sessie opslaan</button>
          </div>
          <span class="settings-toggle" data-settings-toggle="${ex.id}">instellingen (doel reps/sets, stapgrootte)</span>
          <div class="settings-row" id="settings-${ex.id}">
            <div class="field"><label>Doel reps</label><input type="number" id="cfg-reps-${ex.id}" value="${ex.targetReps}"></div>
            <div class="field"><label>Doel sets</label><input type="number" id="cfg-sets-${ex.id}" value="${ex.targetSets}"></div>
            <div class="field"><label>Stap (kg)</label><input type="number" step="0.5" id="cfg-inc-${ex.id}" value="${ex.increment}"></div>
            <button class="ghost" data-save-cfg="${ex.id}" style="align-self:flex-end;">Bewaar instellingen</button>
          </div>
        </div></div>
      `;
      list.appendChild(card);
      if(openCards[ex.id]){
        renderChart(ex.id);
      }
    });
  }

  function renderSuggestion(ex){
    const s = suggestionFor(ex);
    const icon = s.type === 'up' ? '↑' : s.type === 'hold' ? '→' : '•';
    const tip = techniqueTips[ex.id];
    return `<div class="suggestion ${s.type}"><span>${icon}</span><span>${escapeHtml(s.text)}${tip ? `<br><span class="technique-tip">${escapeHtml(tip)}</span>` : ''}</span></div>`;
  }

  function renderLogTable(ex){
    const l = logsFor(ex.id).slice().reverse().slice(0, 8);
    if(l.length === 0) return '';
    const rows = l.map(log => {
      const pr = isPR(ex.id, log);
      return `<tr>
        <td>${fmtDate(log.date)}</td>
        <td class="${pr ? 'weight-pr' : ''}">${log.weight} kg</td>
        <td>${log.sets != null ? log.sets : '–'}</td>
        <td>${log.reps != null ? log.reps : '–'}</td>
        <td>${log.machine ? log.machine : (ex.machine || '–')}</td>
        <td class="row-del-cell"><button class="ghost row-del" data-delete-log="${log.id}" title="Sessie verwijderen" aria-label="Sessie verwijderen">&times;</button></td>
      </tr>`;
    }).join('');
    return `<table class="log-table">
      <tr><th>datum</th><th>gewicht</th><th>sets</th><th>reps</th><th>toestel</th><th></th></tr>
      ${rows}
    </table>`;
  }

  function renderChart(exId){
    const canvas = document.getElementById('chart-' + exId);
    if(!canvas || typeof Chart === 'undefined') return;
    const l = logsFor(exId);
    if(l.length === 0) return;
    if(charts[exId]){ charts[exId].destroy(); }
    charts[exId] = new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: {
        labels: l.map(x => fmtDate(x.date)),
        datasets: [{
          data: l.map(x => x.weight),
          borderColor: '#a8d94a',
          backgroundColor: 'rgba(168,217,74,0.14)',
          pointBackgroundColor: '#a8d94a',
          tension: 0.25,
          fill: true,
        }]
      },
      options: {
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1c1f26',
            titleColor: '#9aa0ab',
            bodyColor: '#ece9e2',
            borderColor: '#333844',
            borderWidth: 1,
            padding: 8,
            displayColors: false,
            callbacks: { label: (ctx) => ctx.parsed.y + ' kg' }
          }
        },
        scales: {
          x: { ticks: { color: '#9aa0ab', font:{size:10} }, grid: { color: '#242832' } },
          y: { ticks: { color: '#9aa0ab', font:{size:10} }, grid: { color: '#242832' } },
        }
      }
    });
  }

  function todayStr(){
    return new Date().toISOString().slice(0,10);
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  document.getElementById('list').addEventListener('click', async (e) => {
    const toggle = e.target.closest('[data-toggle]');
    if(toggle){
      const id = toggle.dataset.toggle;
      openCards[id] = !openCards[id];
      render();
      return;
    }
    const settingsToggle = e.target.closest('[data-settings-toggle]');
    if(settingsToggle){
      const id = settingsToggle.dataset.settingsToggle;
      document.getElementById('settings-' + id).classList.toggle('open');
      return;
    }
    const saveLogBtn = e.target.closest('[data-save-log]');
    if(saveLogBtn){
      const id = saveLogBtn.dataset.saveLog;
      const date = document.getElementById('in-date-' + id).value || todayStr();
      const weight = parseFloat(document.getElementById('in-weight-' + id).value);
      const sets = document.getElementById('in-sets-' + id).value;
      const reps = document.getElementById('in-reps-' + id).value;
      const machine = document.getElementById('in-machine-' + id).value.trim();
      const note = document.getElementById('in-note-' + id).value.trim();
      if(isNaN(weight)){ alert('Vul een gewicht in.'); return; }
      logs.push({
        id: 'log-' + Date.now(),
        exerciseId: id,
        date,
        weight,
        sets: sets ? parseInt(sets) : null,
        reps: reps ? parseInt(reps) : null,
        machine: machine || null,
        note,
      });
      await saveLogs();
      setStatus('opgeslagen');
      render();
      openCards[id] = true;
      render();
      return;
    }
    const saveCfgBtn = e.target.closest('[data-save-cfg]');
    if(saveCfgBtn){
      const id = saveCfgBtn.dataset.saveCfg;
      const ex = exercises.find(x => x.id === id);
      ex.targetReps = parseInt(document.getElementById('cfg-reps-' + id).value) || ex.targetReps;
      ex.targetSets = parseInt(document.getElementById('cfg-sets-' + id).value) || ex.targetSets;
      ex.increment = parseFloat(document.getElementById('cfg-inc-' + id).value) || ex.increment;
      await saveExercises();
      setStatus('opgeslagen');
      render();
      openCards[id] = true;
      render();
      return;
    }
    const delLogBtn = e.target.closest('[data-delete-log]');
    if(delLogBtn){
      const logId = delLogBtn.dataset.deleteLog;
      if(!confirm('Deze sessie verwijderen?')) return;
      const removed = logs.find(l => l.id === logId);
      logs = logs.filter(l => l.id !== logId);
      await saveLogs();
      if(removed) openCards[removed.exerciseId] = true;
      render();
      return;
    }
    const delBtn = e.target.closest('[data-delete-ex]');
    if(delBtn){
      const id = delBtn.dataset.deleteEx;
      if(!confirm('Oefening en bijbehorende sessies verwijderen?')) return;
      exercises = exercises.filter(x => x.id !== id);
      logs = logs.filter(l => l.exerciseId !== id);
      await saveExercises();
      await saveLogs();
      render();
      return;
    }
  });

  document.getElementById('add-ex-btn').addEventListener('click', async () => {
    const name = document.getElementById('new-ex-name').value.trim();
    const machine = document.getElementById('new-ex-machine').value.trim();
    const increment = parseFloat(document.getElementById('new-ex-increment').value) || 2.5;
    const muscleGroup = document.getElementById('new-ex-muscle').value.trim();
    if(!name){ alert('Vul een naam in.'); return; }
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '-' + Date.now();
    exercises.push({id, name, machine, increment, targetReps:8, targetSets:3, muscleGroup: muscleGroup || ''});
    await saveExercises();
    document.getElementById('new-ex-name').value = '';
    document.getElementById('new-ex-machine').value = '';
    document.getElementById('new-ex-increment').value = '2.5';
    document.getElementById('new-ex-muscle').value = '';
    render();
  });

  loadAll();
})();
</script>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registratie mislukt', err));
    });
  }
</script>

</body>
