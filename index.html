<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IJzerlog · Basic Fit tracker</title>
<meta name="theme-color" content="#14151a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<script>
  // localStorage-shim met dezelfde async API als de Claude artifact-opslag,
  // zodat de rest van de app ongewijzigd blijft.
  window.storage = {
    async get(key){
      const v = localStorage.getItem(key);
      if(v === null) throw new Error('key not found: ' + key);
      return {key, value:v};
    },
    async set(key, value){
      localStorage.setItem(key, value);
      return {key, value};
    },
    async delete(key){
      localStorage.removeItem(key);
      return {key, deleted:true};
    },
    async list(prefix){
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return {keys};
    }
  };
</script>

<!--
  Design read (taste-skill 0.B, adapted for a daily-use data tool rather than a landing page):
  a personal strength-training log, checked briefly once or twice a day at the gym, leaning toward
  a dark gym-chalk / "cockpit" language. VISUAL_DENSITY dial pushed toward 6-7 (cockpit): numeric
  readouts (weight, sets, reps, machine no.) use a monospace font so digits align like a real gauge,
  Barlow Condensed stays for headings/names, Inter for body. Accent tempered from a neon #c6f135 to
  a less-saturated #a8d94a (still clearly lime, less searing on-screen), per taste-skill 4.2's
  saturation guidance. Motion restrained per emil-design-eng: opened tens of times a week, so nothing
  animates just to look good; motion only serves state feedback (expand/collapse, press, progress fill).
-->
<style>
  :root{
    --bg:#14151a;
    --surface:#1c1f26;
    --surface-2:#242832;
    --border:#333844;
    --text:#ece9e2;
    --text-dim:#9aa0ab;
    --accent:#a8d94a;
    --accent-dim:#8bb83f;
    --warn:#ff7a45;
    --info:#5b9dd9;
    --star:#f2c53d;
    --radius:10px;
    --ease-out:cubic-bezier(0.23,1,0.32,1);
    --ease-in-out:cubic-bezier(0.77,0,0.175,1);
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:14px 16px 60px;
    max-width:720px;
    margin:0 auto;
  }
  h1,h2,h3{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:0.02em;margin:0;}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:12px;}
  header .brand{display:flex;align-items:center;gap:10px;}
  header h1{font-size:28px;font-weight:800;color:var(--text);}
  header .sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .barbell{width:34px;height:34px;flex-shrink:0;}
  #status{font-size:11px;color:var(--text-dim);text-align:right;}

  .exercise-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    margin-bottom:8px;
    overflow:hidden;
  }
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:11px 16px;
    cursor:pointer;
    gap:10px;
  }
  .card-head:hover{background:var(--surface-2);}
  .card-title{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .name-row{display:flex;align-items:center;gap:7px;min-width:0;}
  .card-title .name{font-size:16px;font-weight:700;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:0.01em;}

  /* Sterretje: los favorieten-systeem, naast Workouts (cyclus 20 teruggezet na cyclus 18).
     Ruime tikzone (min. 24px) voor gebruik met zweethanden in de gym, maar visueel klein
     zodat het de naam niet overstemt. */
  .star{
    background:none;
    border:none;
    padding:0;
    width:24px;
    height:24px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    line-height:1;
    color:var(--border);
    cursor:pointer;
    transition:color 160ms var(--ease-out), transform 160ms var(--ease-out);
  }
  .star.on{color:var(--star);}
  .star:active{transform:scale(0.85);}
  @media (hover:hover) and (pointer:fine){
    .star:hover{color:var(--star);border-color:transparent;}
  }

  .card-title .meta{font-size:12px;color:var(--text-dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .last-date{color:var(--text);font-weight:600;}
  .machine-tag{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:5px;
    padding:1px 6px;
    font-size:11px;
    color:var(--text-dim);
  }
  /* Workout-lidmaatschap als kleine rondjes i.p.v. een pil zoals machine-tag, zodat het
     zich in de metarij duidelijk onderscheidt als "in welke workout(s)" i.p.v. "welke
     spiergroep". Een oefening kan in meerdere workouts tegelijk zitten, dus meerdere
     badges naast elkaar (zie workoutBadges()). */
  .workout-badges{display:inline-flex;gap:3px;flex-shrink:0;}
  .workout-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:17px;
    height:17px;
    border-radius:50%;
    background:var(--surface-2);
    border:1px solid var(--border);
    font-size:10px;
    font-family:var(--font-mono);
    font-weight:700;
    color:var(--text-dim);
    flex-shrink:0;
  }
  .optional-badge{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:5px;
    padding:1px 6px;
    font-size:11px;
    color:var(--info);
  }
  /* Sleep-handvat voor het herordenen. Onzichtbaar buiten een workout-weergave met precies
     1 geselecteerde workout, of de Bovenlichaam/Onderlichaam-weergave (cyclus 20 herstel) —
     dat zijn de enige weergaves met een handmatige volgorde om te herordenen — zo blijft de
     kaart in alle andere weergaves exact zoals hij was. */
  .drag-handle{
    display:none;
    align-items:center;
    justify-content:center;
    width:20px;
    height:20px;
    flex-shrink:0;
    background:none;
    border:none;
    padding:0;
    color:var(--text-dim);
    font-size:16px;
    line-height:1;
    cursor:grab;
    touch-action:none;
    user-select:none;
  }
  #list[data-mode="workout"] .drag-handle,
  #list[data-mode="bodysplit"] .drag-handle{display:flex;}
  .exercise-card.dragging{border-color:var(--accent);opacity:0.92;}
  .card-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .weight-now{font-family:var(--font-mono);font-size:21px;font-weight:700;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .weight-now span{font-size:12px;color:var(--text-dim);font-family:'Inter',sans-serif;font-weight:500;}
  .chev{transition:transform 200ms var(--ease-in-out);color:var(--text-dim);}
  .exercise-card.open .chev{transform:rotate(180deg);}

  .plate-bar{height:5px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:6px;width:100%;}
  .plate-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width 300ms var(--ease-out);}

  /* grid-rows trick: animates height without measuring it in JS, stays interruptible (CSS transition, not keyframes) */
  .card-body-wrap{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows 200ms var(--ease-in-out);
  }
  .exercise-card.open .card-body-wrap{grid-template-rows:1fr;}
  .card-body{
    min-height:0;
    overflow:hidden;
    padding:0 16px 16px;
    border-top:1px solid var(--border);
    opacity:0;
    transition:opacity 160ms var(--ease-out);
  }
  .exercise-card.open .card-body{opacity:1;transition:opacity 200ms var(--ease-out) 60ms;}

  @media (prefers-reduced-motion: reduce){
    .chev,.plate-bar-fill,.card-body-wrap,.card-body,button{transition-duration:0ms !important;}
  }

  .suggestion{
    margin:14px 0 10px;
    padding:10px 12px;
    border-radius:8px;
    font-size:13px;
    line-height:1.4;
    display:flex;
    gap:8px;
    align-items:flex-start;
  }
  .suggestion.up{background:rgba(168,217,74,0.10);border:1px solid rgba(168,217,74,0.4);color:var(--accent);}
  .suggestion.hold{background:rgba(255,122,69,0.08);border:1px solid rgba(255,122,69,0.35);color:var(--warn);}
  .suggestion.plateau{background:rgba(91,157,217,0.10);border:1px solid rgba(91,157,217,0.4);color:var(--info);}
  .suggestion.none{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);}

  table.log-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
  table.log-table th{text-align:left;color:var(--text-dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.03em;padding:4px 6px;border-bottom:1px solid var(--border);}
  table.log-table td{padding:6px 6px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  table.log-table td:first-child{font-family:'Inter',sans-serif;}
  table.log-table tbody tr:nth-child(even) td{background:var(--surface-2);}
  table.log-table tbody tr:first-child td{border-radius:6px 6px 0 0;}
  table.log-table tbody tr:last-child td{border-radius:0 0 6px 6px;}
  .weight-pr{color:var(--accent);font-weight:700;}
  .row-del-cell{width:1%;text-align:right;padding-right:2px !important;}
  .row-del{padding:2px 7px;font-size:14px;line-height:1;color:var(--text-dim);border-color:transparent;background:transparent;}
  .row-del:hover{color:var(--warn);border-color:var(--warn);background:rgba(255,122,69,0.08);}

  canvas.chart{margin-top:14px;max-height:180px;}

  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:70px;}
  .field label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.03em;}
  input,textarea{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:6px;
    padding:8px 9px;
    font-size:14px;
    font-family:inherit;
    width:100%;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--accent);}
  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    border-radius:7px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    padding:9px 14px;
    cursor:pointer;
    transition:transform 160ms var(--ease-out), border-color 160ms var(--ease-out), background 160ms var(--ease-out);
  }
  @media (hover:hover) and (pointer:fine){
    button:hover{border-color:var(--accent);}
    button.primary:hover{background:var(--accent-dim);border-color:var(--accent-dim);}
  }
  button:active{transform:scale(0.97);}
  button.primary{background:var(--accent);color:#14151a;border-color:var(--accent);}
  button.ghost{background:transparent;border-color:transparent;color:var(--text-dim);padding:6px 8px;}
  a.video-link{display:inline-block;font-family:'Inter',sans-serif;font-weight:600;font-size:12px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);padding:7px 12px;text-decoration:none;margin-bottom:12px;}
  @media (hover:hover) and (pointer:fine){ a.video-link:hover{border-color:var(--accent);color:var(--text);} }
  .actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;}
  .settings-toggle{font-size:11px;color:var(--text-dim);cursor:pointer;text-decoration:underline;margin-top:10px;display:inline-block;}
  .settings-row{display:none;gap:8px;margin-top:8px;}
  .settings-row.open{display:flex;flex-wrap:wrap;}

  .top-tip{
    display:flex;
    align-items:baseline;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:8px;
    padding:8px 14px;
    margin-bottom:12px;
    font-size:13px;
    color:var(--text);
    line-height:1.4;
  }
  /* Rustige rij bedieningselementen (weergave, filters, progressiebereik, blok) —
     spacing bewust krap gehouden zodat een extra dropdown (blok-selectie) niet
     ten koste gaat van hoeveel kaarten er boven de vouw zichtbaar zijn. */
  .controls{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:12px;
    align-items:flex-end;
  }
  .control{display:flex;flex-direction:column;gap:3px;flex:1;min-width:130px;}
  .control label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.03em;}
  .control select,.control input{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:6px;
    padding:7px 9px;
    font-size:13px;
    font-family:inherit;
    width:100%;
  }
  .control select:focus,.control input:focus{outline:none;border-color:var(--accent);}

  .filter-toggles{display:flex;gap:6px;}
  .filter-toggle{
    display:flex;align-items:center;gap:6px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:6px;
    padding:7px 10px;
    font-size:13px;
    flex:1;
    cursor:pointer;
    user-select:none;
  }
  .filter-toggle input{width:auto;margin:0;accent-color:var(--accent);}
  .filter-toggle:has(input:checked){border-color:var(--accent);color:var(--accent);}

  .group-header{
    font-family:'Barlow Condensed',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-size:12px;
    font-weight:700;
    color:var(--text-dim);
    margin:14px 0 6px;
    padding-bottom:5px;
    border-bottom:1px solid var(--border);
  }
  .group-header:first-child{margin-top:0;}

  /* "Vandaag"-weergave: al gelogde oefeningen gedimd naar achteren, zodat wat nog
     openstaat vooraan en op volle sterkte staat. */
  .exercise-card.done-today{opacity:0.45;}
  .exercise-card.done-today.open{opacity:1;}
  .done-mark{color:var(--accent);}

  .top-tip-label{
    font-family:'Barlow Condensed',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-size:11px;
    color:var(--accent);
    font-weight:700;
    flex-shrink:0;
  }

  .add-exercise{
    background:var(--surface);
    border:1px dashed var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-top:18px;
  }
  .add-exercise h3{font-size:14px;color:var(--text-dim);margin-bottom:8px;}
  .empty{color:var(--text-dim);font-size:13px;padding:20px;text-align:center;}
  .footer-actions{display:flex;justify-content:center;gap:16px;margin-top:24px;}
  .footer-actions .ghost{color:var(--text-dim);font-size:12px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="barbell" viewBox="0 0 48 48" fill="none">
      <rect x="4" y="18" width="6" height="12" rx="1.5" fill="var(--accent)"/>
      <rect x="10" y="14" width="4" height="20" rx="1.5" fill="var(--accent)"/>
      <rect x="14" y="21" width="20" height="6" rx="2" fill="var(--text)"/>
      <rect x="34" y="14" width="4" height="20" rx="1.5" fill="var(--accent)"/>
      <rect x="38" y="18" width="6" height="12" rx="1.5" fill="var(--accent)"/>
    </svg>
    <div>
      <h1>IJzerlog</h1>
      <div class="sub">Basic Fit Hilversum</div>
    </div>
  </div>
  <div id="status"></div>
</header>

<div id="top-tip" class="top-tip" style="display:none;">
  <span class="top-tip-label">Focus</span>
  <span id="top-tip-text"></span>
</div>


<div class="controls">
  <div class="control">
    <label for="view-mode">Weergave</label>
    <select id="view-mode">
      <option value="alfabetisch">Alfabetisch</option>
      <option value="spiergroep">Spiergroep</option>
      <option value="boven">Bovenlichaam</option>
      <option value="onder">Onderlichaam</option>
      <option value="laatst">Laatst gedaan</option>
    </select>
  </div>
  <div class="control filter-control">
    <label>Filters</label>
    <div class="filter-toggles">
      <label class="filter-toggle"><input type="checkbox" id="filter-today"> Vandaag</label>
      <label class="filter-toggle"><input type="checkbox" id="filter-pinned"> Sterretje</label>
    </div>
  </div>
  <div class="control">
    <label for="range-mode">Progressie vanaf</label>
    <select id="range-mode">
      <option value="all">Begin</option>
      <option value="1m">1 maand</option>
      <option value="3m">3 maanden</option>
      <option value="6m">6 maanden</option>
      <option value="ytd">Dit jaar</option>
      <option value="custom">Aangepast</option>
    </select>
  </div>
  <div class="control" id="custom-range-wrap" style="display:none;">
    <label for="range-from">Vanaf datum</label>
    <input type="date" id="range-from">
  </div>
  <div class="control" id="workout-filter-control">
    <label for="workout-filter">Workout</label>
    <select id="workout-filter"></select>
  </div>
</div>

<div id="list"></div>

<div class="add-exercise">
  <h3>Nieuwe oefening toevoegen</h3>
  <div class="row">
    <div class="field" style="flex:2;min-width:140px;">
      <label>Naam</label>
      <input id="new-ex-name" placeholder="bv. triceps press">
    </div>
    <div class="field">
      <label>Toestelnr.</label>
      <input id="new-ex-machine" placeholder="bv. 27">
    </div>
    <div class="field">
      <label>Stap (kg)</label>
      <input id="new-ex-increment" type="number" step="0.5" value="2.5">
    </div>
    <div class="field">
      <label>Spiergroep</label>
      <select id="new-ex-category"></select>
    </div>
    <div class="field">
      <label>Specifieke spier</label>
      <input id="new-ex-muscle" placeholder="bv. hamstrings, liezen">
    </div>
  </div>
  <div class="actions">
    <button class="primary" id="add-ex-btn">Toevoegen</button>
  </div>
</div>

<div class="footer-actions">
  <button class="ghost" id="export-btn">Exporteer data</button>
  <button class="ghost" id="import-btn">Importeer data</button>
  <input type="file" id="import-file" accept="application/json,.json" style="display:none;">
</div>

<script>
(function(){
  const STORAGE_KEY_EX = 'basicfit-exercises-v1';
  const STORAGE_KEY_LOGS = 'basicfit-logs-v1';

  const seedExercises = [
    {id:'seated-dip', name:'Seated dip', machine:'52', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'triceps/borst', muscleCategory:'armen'},
    {id:'back-extension', name:'Back extension', machine:'43', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'onderrug', muscleCategory:'rug'},
    {id:'fly', name:'Fly', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'borst', muscleCategory:'borst'},
    {id:'shoulder-press', name:'Shoulder press', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'schouders', muscleCategory:'schouders'},
    {id:'abdominal-crunch', name:'Abdominal crunch', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'buik', muscleCategory:'buik'},
    {id:'perfect-squat', name:'Perfect squat', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'quadriceps', muscleCategory:'benen'},
    {id:'leg-extension', name:'Leg extension', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'quadriceps', muscleCategory:'benen'},
    {id:'leg-press', name:'Leg press', machine:'53', increment:5, targetReps:8, targetSets:3, muscleGroup:'quadriceps/bilspieren', muscleCategory:'benen'},
    {id:'diverging-lat-pulldown', name:'Diverging lat pulldown', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'rug', muscleCategory:'rug'},
    {id:'chest-press', name:'Chest press', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'borst', muscleCategory:'borst'},
    {id:'lateral-raise', name:'Lateral raise', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'schouders', muscleCategory:'schouders'},
    {id:'squat', name:'Squat', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'quadriceps', muscleCategory:'benen'},
    {id:'lat-pulldown', name:'Lat pulldown', machine:'', increment:2.5, targetReps:8, targetSets:3, muscleGroup:'rug', muscleCategory:'rug'},

  // (zie `workouts`/STORAGE_KEY_WORKOUTS). Jasper selecteert in de Workouts-filter één of

  // 6 hoofdcategorieën en was al ingevuld voor de bestaande oefeningen.
  const LEGACY_MUSCLE_MAP = {
    borst:'borst', chest:'borst', pectoralis:'borst',
    rug:'rug', onderrug:'rug', lats:'rug', latissimus:'rug',
    schouders:'schouders', schouder:'schouders', deltoids:'schouders',

  // Alleen gebruikt om bestaande (oudere) data zonder muscleCategory eenmalig in te
  // delen op basis van het vrije tekstlabel dat er toen al in stond.
  function legacyMuscleCat(ex){
    if(!ex.muscleGroup) return 'overig';
    const parts = ex.muscleGroup.toLowerCase().split('/').map(s => s.trim());
    for(const p of parts){ if(LEGACY_MUSCLE_MAP[p]) return LEGACY_MUSCLE_MAP[p]; }
    return 'overig';
  }

  function muscleCat(ex){
    return ex.muscleCategory || legacyMuscleCat(ex);
  }

  // Eén pil i.p.v. twee: de categorie stuurt nog steeds alle logica, maar het losse
  // detail-label (bijv. "hamstrings") wordt er weer bij getoond zodra dat iets toevoegt
  // boven de categorienaam zelf. Zo blijft de kaart rustig (één vlakje) maar zie je toch
  // welke specifieke spier het is, niet alleen de brede groep.
  function categoryPillText(ex){
    const catLabel = MUSCLE_LABELS[muscleCat(ex)] || muscleCat(ex);
    const detail = (ex.muscleGroup || '').trim();
    if(!detail || detail.toLowerCase() === catLabel.toLowerCase()) return catLabel;
    return catLabel + ' · ' + detail;
  }

  // Kleine rondjes met de workout-letter(s) in de metarij, zodat je ook in de gewone (niet
  // workout-gefilterde) weergave in één oogopslag ziet in welke workout(s) een oefening
  // zit — een oefening kan in meerdere workouts tegelijk voorkomen, dus desnoods meerdere
  // badges naast elkaar. Geen badge voor een oefening die nergens bij hoort (nog in de
  // bibliotheek, nog niet toegewezen).
  function workoutShortLabel(w){
    return w.id.charAt(0).toUpperCase();

  function workoutBadges(ex){
    const member = workouts.filter(w => w.items.some(it => it.exerciseId === ex.id));
    if(!member.length) return '';
    return '<span class="workout-badges">' + member.map(w =>

    ).join('') + '</span>';

  function buildSeedLogs(){

  const STORAGE_KEY_PREFS = 'basicfit-prefs-v1';
  const STORAGE_KEY_WORKOUTS = 'basicfit-workouts-v1';

  let exercises = [];

  let openCards = {};

  let filterToday = false;
  let filterPinned = false; // sterretje: los favorieten-systeem, naast Workouts (cyclus 20 teruggezet)
  let workoutFilter = ''; // '' = geen workout geselecteerd, anders een workout-id (precies 1, zoals de oude blokken-dropdown)

  function setStatus(msg){

  async function loadAll(){
    try{
      const exRes = await window.storage.get(STORAGE_KEY_EX);
      exercises = exRes ? JSON.parse(exRes.value) : null;
    }catch(e){ exercises = null; }
    try{
      const logRes = await window.storage.get(STORAGE_KEY_LOGS);
      logs = logRes ? JSON.parse(logRes.value) : null;
    }catch(e){ logs = null; }

    let needSave = false;
    if(!exercises){ exercises = seedExercises; needSave = true; }
    if(!logs){ logs = buildSeedLogs(); needSave = true; }

    if(needSave){
      await saveExercises();
      await saveLogs();
    }

    // Workouts: eigen opslagsleutel, los van exercises/logs, zodat ze meegaan in een
    // export/import zonder de rest van het datamodel te raken (zie DEFAULT_WORKOUTS
    // hierboven). Nog geen eigen sleutel gezien (eerste load na deze update, of een
    // verse installatie) → seeden met Jaspers startindeling en meteen opslaan, net
    // als exercises/logs hierboven.
    try{
      const wkRes = await window.storage.get(STORAGE_KEY_WORKOUTS);
      workouts = wkRes ? JSON.parse(wkRes.value) : null;
    }catch(e){ workouts = null; }
    if(!workouts){
      workouts = DEFAULT_WORKOUTS.map(w => ({...w, items: w.items.map(it => ({...it}))}));
      await saveWorkouts();
    }

    try{
      const prefRes = await window.storage.get(STORAGE_KEY_PREFS);
      const p = JSON.parse(prefRes.value);
      if(p.viewMode) viewMode = p.viewMode;
      if(p.rangeMode) rangeMode = p.rangeMode;
      if(p.customFrom) customFrom = p.customFrom;
      if(typeof p.filterToday === 'boolean') filterToday = p.filterToday;
      if(typeof p.filterPinned === 'boolean') filterPinned = p.filterPinned;
      if(typeof p.workoutFilter === 'string') workoutFilter = p.workoutFilter;
      // Terugval voor wie v24 al even open heeft gehad: toen was dit tijdelijk een array
      // (meerdere workouts tegelijk selecteren). Simpelweg de eerste nemen zodat niemand
      // met een kapotte voorkeur vastloopt.
      else if(Array.isArray(p.workoutFilter) && p.workoutFilter.length > 0 && typeof p.workoutFilter[0] === 'string') workoutFilter = p.workoutFilter[0];
    }catch(e){ /* nog geen voorkeuren opgeslagen, standaardwaarden blijven staan */ }

    // Migratie: 'vandaag' bestaat niet meer als weergave-optie, dat is nu een losse filter.
    // 'gepind' (als weergave-optie, niet de filter-checkbox) bestaat sinds cyclus 18 niet
    // meer — een oude opgeslagen voorkeur valt terug op Alfabetisch i.p.v. stil te breken.
    // 'boven'/'onder' zijn in cyclus 20 weer teruggekomen (zie render()), dus die vallen
    // hier NIET meer terug.
    if(viewMode === 'vandaag'){ viewMode = 'alfabetisch'; filterToday = true; }

      await saveExercises();
    }

    render();

  function renderWorkoutFilterOptions(){

    sel.innerHTML = '<option value="">Alle oefeningen</option>' +
      workouts.map(w => `<option value="${w.id}">${escapeHtml(w.name)}</option>`).join('');

    document.getElementById('view-mode').value = viewMode;
    document.getElementById('filter-today').checked = filterToday;
    document.getElementById('filter-pinned').checked = filterPinned;

  // Eenmalige/idempotente opschoning voor een AL bestaande installatie (data staat al in
  // localStorage op de telefoon): nieuwe standaardoefeningen toevoegen als ze nog niet
  // bestaan, spiergroep-labels aanvullen op bestaande oefeningen, en het oude reps-doel
  // van 12 (hypertrofie-achtig) eenmalig verlagen naar 8 (meer kracht/progressive-overload
  // gericht) zonder een eventuele eigen aanpassing van Jasper te overschrijven.
  async function migrate(){
    let changed = false;

    // Zelfherstellend, WEL bij elke load (in tegenstelling tot de eenmalige stappen
    // hieronder): een oefening zonder geldige `name` (bv. ontstaan doordat een
    // correctie-import per ongeluk als eerste liep en zo'n object met alleen id/block
    // aanmaakte, zoals in cyclus 14 gebeurde) laat anders de hele sortering — en dus de
    // hele lijst — crashen. Zo'n object krijgt hier een zichtbare placeholder-naam terug
    // in plaats van dat het stilzwijgend verwijderd wordt: Jasper ziet 'm dan gewoon
    // terug als kaart en kan zelf beslissen (aanvullen of met de bestaande
    // verwijder-knop weghalen) in plaats van dat er ongevraagd data verdwijnt.
    exercises.forEach(e => {
      if(typeof e.name !== 'string' || !e.name.trim()){
        e.name = '(naamloze oefening — controleer instellingen)';
        changed = true;
      }
    });

    // Eenmalig, niet bij elke load: anders komt een bewust verwijderde standaardoefening
    // (bijv. Jasper haalde 'Calf raise' weg omdat hij 'Seated Calf' gebruikt) na een
    // refresh steeds weer terug als een zombie-entry.
    let backfillDone = false;
    try{
      const flag = await window.storage.get('basicfit-migration-backfill-v1');
      backfillDone = flag.value === 'done';
    }catch(e){ backfillDone = false; }
    if(!backfillDone){
      exercisesToBackfill.forEach(def => {
        if(!exercises.find(e => e.id === def.id)){
          exercises.push({...def});
          changed = true;
        }
      });
      await window.storage.set('basicfit-migration-backfill-v1', 'done');
    }

    exercises.forEach(e => {
      if(!e.muscleGroup && muscleGroupById[e.id]){
        e.muscleGroup = muscleGroupById[e.id];
        changed = true;
      }
    });

    // muscleCategory is de nieuwe, robuuste indeling (vaste dropdown-waarden i.p.v. vrije
    // tekst). Oefeningen die deze nog missen krijgen 'm eenmalig: bekende standaardoefeningen
    // via hun vaste categorie, eigen toevoegingen via de oude fuzzy-match op hun bestaande
    // tekstlabel, zodat de spiergroep-weergave niet stilletjes in 'overig' terechtkomt.
    exercises.forEach(e => {
      if(!e.muscleCategory){
        e.muscleCategory = muscleCategoryById[e.id] || legacyMuscleCat(e);
        changed = true;
      }
    });

    // isAssisted expliciet false zetten (i.p.v. undefined te laten) zodat de
    // progressie-/PR-berekeningen altijd een echte boolean tegenkomen.
    exercises.forEach(e => {
      if(typeof e.isAssisted === 'undefined'){
        e.isAssisted = false;
        changed = true;
      }
    });

    let repsMigrated = false;
    try{
      const flag = await window.storage.get('basicfit-migration-reps8-v1');
      repsMigrated = flag.value === 'done';
    }catch(e){ repsMigrated = false; }
    if(!repsMigrated){
      exercises.forEach(e => {
        if(e.targetReps === 12){ e.targetReps = 8; changed = true; }
      });
      await window.storage.set('basicfit-migration-reps8-v1', 'done');
    }

    // Eenmalig (cyclus 18): het oude blokken-systeem (block, blockOrder) is vervangen door
    // Workouts. Deze velden op de oefeningen zelf zijn overbodig geworden — workout-
    // lidmaatschap en -volgorde wonen voortaan in `workouts` (zie DEFAULT_WORKOUTS), niet
    // meer op de oefening. Actief verwijderen i.p.v. laten hangen, zodat een nieuwe export
    // er niet mee rondsleept. `pinned` (sterretje) en `upperOrder`/`lowerOrder`
    // (Bovenlichaam/Onderlichaam-sleepvolgorde) stonden hier tot cyclus 19 ook bij, maar
    // zijn in cyclus 20 beide weer actief (los van Workouts, dat blijft gewoon bestaan) —
    // dus die worden hier niet meer gestript. Voor wie deze migratie vóór cyclus 20 al
    // doorliep (die velden waren toen al verwijderd uit de opslag) biedt een los
    // importbestand herstel vanaf de laatst bekende export, zie de les hieronder.
    let workoutsMigrated = false;
    try{
      const flag = await window.storage.get('basicfit-migration-workouts-v1');
      workoutsMigrated = flag.value === 'done';
    }catch(e){ workoutsMigrated = false; }
    if(!workoutsMigrated){
      exercises.forEach(e => {
        ['block','blockOrder'].forEach(key => {
          if(key in e){ delete e[key]; changed = true; }
        });
      });
      await window.storage.set('basicfit-migration-workouts-v1', 'done');
    }

    return changed;
  }

  async function saveExercises(){
    try{
      await window.storage.set(STORAGE_KEY_EX, JSON.stringify(exercises));
    }catch(e){ console.error('opslaan mislukt', e); setStatus('opslaan mislukt'); }
  }
  async function saveLogs(){
    try{
      await window.storage.set(STORAGE_KEY_LOGS, JSON.stringify(logs));
    }catch(e){ console.error('opslaan mislukt', e); setStatus('opslaan mislukt'); }
  }
  async function saveWorkouts(){
    try{
      await window.storage.set(STORAGE_KEY_WORKOUTS, JSON.stringify(workouts));
    }catch(e){ console.error('opslaan mislukt', e); setStatus('opslaan mislukt'); }
  }

  // Importeren is bewust ALLEEN toevoegen/bijwerken, nooit verwijderen. Reden: een export
  // is een moment-opname, en tussen exporteren en weer importeren kunnen er op de telefoon
  // alweer nieuwe sessies bijgekomen zijn. Een 'vervang alles'-import zou die stilletjes
  // wissen. Bestaande oefeningen krijgen hun velden bijgewerkt (zo landen correcties zoals
  // een aangepaste spiergroep-categorie); bestaande logs worden met rust gelaten (logs zijn
  // in de praktijk write-once, er is al een aparte verwijderknop per sessie); alles wat nog
  // niet bestaat wordt toegevoegd. Niets dat al in de app staat verdwijnt door een import.
  function buildImportPlan(data){
    const errors = [];
    if(!data || typeof data !== 'object'){ errors.push('Bestand is geen geldig JSON-object.'); return { errors }; }
    if(!Array.isArray(data.exercises)){ errors.push('Veld "exercises" ontbreekt of is geen lijst.'); }
    if(!Array.isArray(data.logs)){ errors.push('Veld "logs" ontbreekt of is geen lijst.'); }
    if(errors.length) return { errors };

    const exByIdNow = new Map(exercises.map(e => [e.id, e]));
    const logIdsNow = new Set(logs.map(l => l.id));

    const newExercises = [];
    const updatedExercises = [];
    let unchangedExercises = 0;
    data.exercises.forEach(imp => {
      if(!imp || !imp.id){ errors.push('Een oefening in het bestand mist een id, overgeslagen.'); return; }
      const current = exByIdNow.get(imp.id);
      if(!current){ newExercises.push(imp); return; }
      const changedKeys = Object.keys(imp).filter(k => k !== 'id' && JSON.stringify(imp[k]) !== JSON.stringify(current[k]));
      if(changedKeys.length) updatedExercises.push({ id: imp.id, name: current.name, changedKeys, imp });
      else unchangedExercises++;
    });

    const newLogs = [];
    let skippedLogs = 0;
    data.logs.forEach(imp => {
      if(!imp || !imp.id){ errors.push('Een sessie in het bestand mist een id, overgeslagen.'); return; }
      if(logIdsNow.has(imp.id)) skippedLogs++;
      else newLogs.push(imp);
    });

    // Workouts zijn optioneel in een importbestand (oudere exports hebben dit veld niet).
    // Zelfde merge-only principe als exercises: per workout-id alleen items toevoegen of
    // bijwerken die in het bestand staan; een item dat lokaal al bestaat maar niet in het
    // bestand voorkomt blijft gewoon staan (import verwijdert nooit workout-lidmaatschap —
    // dat kan alleen handmatig in de app, via het bewerk-paneel van een oefening).
    const { newWorkouts, updatedWorkouts } = buildWorkoutChanges(data.workouts);

    return { errors, newExercises, updatedExercises, unchangedExercises, newLogs, skippedLogs, newWorkouts, updatedWorkouts };
  }

  function buildWorkoutChanges(importedWorkouts){
    const newWorkouts = [];
    const updatedWorkouts = [];
    if(Array.isArray(importedWorkouts)){
      importedWorkouts.forEach(iw => {
        if(!iw || !iw.id || !Array.isArray(iw.items)) return;
        const current = workouts.find(w => w.id === iw.id);
        if(!current){ newWorkouts.push(iw); return; }
        const nameChanged = !!(iw.name && iw.name !== current.name);
        const addedItems = [];
        const updatedItems = [];
        iw.items.forEach(ii => {
          if(!ii || !ii.exerciseId) return;
          const curItem = current.items.find(x => x.exerciseId === ii.exerciseId);
          if(!curItem){ addedItems.push(ii); return; }
          const changedKeys = ['order','sets','optional'].filter(k => JSON.stringify(ii[k]) !== JSON.stringify(curItem[k]));
          if(changedKeys.length) updatedItems.push({ exerciseId: ii.exerciseId, changedKeys, imp: ii });
        });
        if(nameChanged || addedItems.length || updatedItems.length){
          updatedWorkouts.push({ id: iw.id, oldName: current.name, newName: iw.name, nameChanged, addedItems, updatedItems });
        }
      });
    }
    return { newWorkouts, updatedWorkouts };
  }

  function applyImportPlan(plan){
    plan.newExercises.forEach(imp => exercises.push({...imp}));
    plan.updatedExercises.forEach(u => {
      const current = exercises.find(e => e.id === u.id);
      if(current) Object.assign(current, u.imp);
    });
    plan.newLogs.forEach(imp => logs.push({...imp}));
    plan.newWorkouts.forEach(w => workouts.push({...w, items: w.items.map(it => ({...it}))}));
    plan.updatedWorkouts.forEach(u => {
      const w = workouts.find(x => x.id === u.id);
      if(!w) return;
      if(u.nameChanged) w.name = u.newName;
      u.addedItems.forEach(ii => w.items.push({...ii}));
      u.updatedItems.forEach(ui => {
        const item = w.items.find(x => x.exerciseId === ui.exerciseId);
        if(item) Object.assign(item, ui.imp);
      });
    });
  }

  function describeImportPlan(plan){
    const lines = [];
    if(plan.newExercises.length) lines.push(plan.newExercises.length + ' nieuwe oefening(en): ' + plan.newExercises.map(e => e.name).join(', '));
    if(plan.updatedExercises.length) lines.push(plan.updatedExercises.length + ' oefening(en) bijgewerkt: ' + plan.updatedExercises.map(u => u.name + ' (' + u.changedKeys.join(', ') + ')').join('; '));
    if(plan.newLogs.length) lines.push(plan.newLogs.length + ' nieuwe sessie(s) toegevoegd.');
    if(plan.skippedLogs) lines.push(plan.skippedLogs + ' sessie(s) al aanwezig, overgeslagen.');
    if(plan.newWorkouts.length) lines.push(plan.newWorkouts.length + ' nieuwe workout(s): ' + plan.newWorkouts.map(w => w.name).join(', '));
    if(plan.updatedWorkouts.length) lines.push(plan.updatedWorkouts.length + ' workout(s) bijgewerkt: ' + plan.updatedWorkouts.map(u =>
      u.newName + (u.nameChanged ? ' (naam: ' + u.oldName + ' → ' + u.newName + ')' : '')
      + (u.addedItems.length ? ', ' + u.addedItems.length + ' oefening(en) toegevoegd' : '')
      + (u.updatedItems.length ? ', ' + u.updatedItems.length + ' oefening(en) bijgewerkt' : '')
    ).join('; '));
    if(!lines.length) lines.push('Niets nieuws of gewijzigd gevonden in dit bestand.');
    lines.push('Er wordt niets verwijderd.');
    return lines.join('\n');
  }

  function logsFor(exId){
    return logs.filter(l => l.exerciseId === exId).sort((a,b)=> a.date.localeCompare(b.date));
  }

  function latestLog(exId){
    const l = logsFor(exId);
    return l.length ? l[l.length-1] : null;
  }

  // Alleen een écht nieuw record: strikt zwaarder dan alles ervoor (dus geen "PR" meer
  // bij een herhaling van je huidige max, en de allereerste log ooit telt niet mee
  // want die verbetert nog niets). Bij een 'assisted' toestel is minder gewicht juist
  // beter, dus daar draait de vergelijking om.
  function isPR(exId, log){
    const before = logsFor(exId).filter(l => l.date < log.date);
    if(before.length === 0) return false;
    const ex = exercises.find(e => e.id === exId);
    if(ex && ex.isAssisted) return before.every(l => l.weight > log.weight);
    return before.every(l => l.weight < log.weight);
  }

  // Progressive-overload state machine per oefening. Drie stille toestanden:
  // - niets (nog in opbouw, niet genoeg gegevens om iets zinnigs te zeggen)
  // - 'hold' (consolidatie: 1x het streefaantal reps gehaald, nog 1x herhalen met
  //   strikte vorm voor de knop echt om moet)
  // - 'up' (verhoging verdiend: STREAK_TO_ADVANCE keer op rij gehaald)
  // - 'plateau' (hetzelfde gewicht staat >= PLATEAU_SESSIONS sessies vast zonder dat de
  //   reps-streak op gang komt: geen kilo's forceren, tempo-overload voorstellen i.p.v.
  //   gewoon te blijven aandringen — dit is de tendon-veiligheidsklep uit Gemini's module 2).
  function suggestionFor(ex){
    const l = logsFor(ex.id);
    if(l.length === 0) return null;
    const lastLog = l[l.length - 1];
    const dir = ex.isAssisted ? -1 : 1;

    let repStreak = 0;
    let streakWeight = null;
    for(let i = l.length - 1; i >= 0; i--){
      const log = l[i];
      if(log.reps == null || log.reps < ex.targetReps) break;
      if(streakWeight === null) streakWeight = log.weight;
      else if(log.weight !== streakWeight) break;
      repStreak++;
    }

    if(repStreak >= STREAK_TO_ADVANCE){
      const next = (streakWeight + dir * ex.increment).toFixed(1).replace(/\.0$/,'');
      return {
        type:'up',
        text: repStreak + ' sessies op rij ' + ex.targetReps + '+ reps met ' + streakWeight + ' kg. Tijd om naar ' + next + ' kg te gaan.',
      };
    }
    if(repStreak === 1){
      return {
        type:'hold',
        text: 'Eerste keer ' + ex.targetReps + '+ reps met ' + streakWeight + ' kg. Herhaal dit gewicht nog één sessie met strikte vorm voor je omhoog gaat.',
      };
    }

    let sameWeightRun = 0;
    for(let i = l.length - 1; i >= 0; i--){
      if(l[i].weight !== lastLog.weight) break;
      sameWeightRun++;
    }
    if(sameWeightRun >= PLATEAU_SESSIONS){
      return {
        type:'plateau',
        text: lastLog.weight + ' kg staat al ' + sameWeightRun + ' sessies vast. Forceer geen kilo\'s (peesveiligheid); focus de komende sessies op tempo: 3 sec zakken, 1 sec pauze onderin.',
      };
    }
    return null;
  }

  // Begindatum van het gekozen progressiebereik, of null voor "vanaf het begin".
  function rangeFromDate(){
    if(rangeMode === 'all') return null;
    if(rangeMode === 'custom') return customFrom || null;
    if(rangeMode === 'ytd') return todayStr().slice(0,4) + '-01-01';
    const months = rangeMode === '1m' ? 1 : rangeMode === '3m' ? 3 : rangeMode === '6m' ? 6 : 0;
    if(!months) return null;
    const d = new Date(todayStr() + 'T00:00:00');
    d.setMonth(d.getMonth() - months);
    return d.toISOString().slice(0,10);
  }

  function logsInRange(exId){
    const from = rangeFromDate();
    const l = logsFor(exId);
    return from ? l.filter(x => x.date >= from) : l;
  }

  // Percentage berekend binnen het gekozen bereik: eerste gelogde gewicht ná de
  // begindatum versus het laatste. Zo zie je bijvoorbeeld alleen de winst sinds juli
  // in plaats van sinds je allereerste sessie. Bij een 'assisted' toestel betekent
  // minder gewicht (minder tegenwicht) juist vooruitgang, dus die telt omgekeerd.
  function pctChange(exId){
    const l = logsInRange(exId);
    if(l.length < 2) return null;
    const first = l[0].weight, last = l[l.length-1].weight;
    if(!first) return null;
    const ex = exercises.find(e => e.id === exId);
    if(ex && ex.isAssisted) return ((first - last) / first) * 100;
    return ((last - first) / first) * 100;
  }

  // Voortgang richting een zelf ingesteld doelgewicht (optioneel per oefening), los van
  // het gekozen progressiebereik. Bij een gewone oefening is dat simpelweg huidig/doel.
  // Bij 'assisted' is minder tegenwicht beter: het hoogst ooit gelogde gewicht (het
  // zwaarst-ondersteunde punt) dient als referentie-startpunt, en de balk vult zich
  // naarmate je richting het doel (minder hulp) beweegt. Clamped 0-100%: verder dan het
  // doel bestaat niet, minder dan 0 evenmin.
  function goalPct(ex, current){
    if(ex.targetWeight == null || isNaN(ex.targetWeight)) return null;
    const target = ex.targetWeight;
    if(ex.isAssisted){
      const weights = logsFor(ex.id).map(l => l.weight).concat([current]);
      const ref = Math.max(...weights);
      if(ref <= target) return 100;
      return Math.min(Math.max(((ref - current) / (ref - target)) * 100, 0), 100);
    }
    if(target <= 0) return null;
    return Math.min(Math.max((current / target) * 100, 0), 100);
  }

  function fmtDate(d){
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('nl-NL', {day:'2-digit', month:'short'});
  }

  // Kijkt over ALLE oefeningen heen (niet per kaart) welke spiergroep-categorie het
  // langst geleden (of nog nooit) getraind is, en stelt daar één concrete oefening voor.
  // Groepeert op de vaste muscleCategory (niet meer het vrije muscleGroup-label: anders
  // telden oefeningen zonder ingevuld label nooit mee, en dat label is nu sowieso alleen
  // nog een weergavedetail). Blijft stil (geen tip) zolang er geen echte achterstand is,
  // zodat het geen ruis wordt als je redelijk gelijkmatig traint.
  function computeTopTip(){
    const todayD = new Date(todayStr() + 'T00:00:00');
    const groups = {};
    exercises.forEach(ex => {
      const key = muscleCat(ex);
      const exLogs = logsFor(ex.id);
      const lastDate = exLogs.length ? exLogs[exLogs.length - 1].date : null;
      if(!groups[key]) groups[key] = { lastDate: null, exercises: [] };
      groups[key].exercises.push({ name: ex.name, logCount: exLogs.length });
      if(lastDate && (!groups[key].lastDate || lastDate > groups[key].lastDate)){
        groups[key].lastDate = lastDate;
      }
    });

    let worstKey = null, worstDays = -1;
    Object.keys(groups).forEach(key => {
      const g = groups[key];
      const days = g.lastDate
        ? Math.round((todayD - new Date(g.lastDate + 'T00:00:00')) / 86400000)
        : Infinity;
      if(days > worstDays){ worstDays = days; worstKey = key; }
    });

    if(!worstKey || worstDays < 10) return null;

    const g = groups[worstKey];
    const target = g.exercises.slice().sort((a, b) => a.logCount - b.logCount)[0];
    const label = MUSCLE_LABELS[worstKey] || worstKey;
    const whenText = worstDays === Infinity ? 'nog nooit getraind' : worstDays + ' dagen niet getraind';
    return label + ' ' + whenText + '. Misschien een moment voor ' + target.name + ' de komende sessie.';
  }

  function renderTopTip(){
    const el = document.getElementById('top-tip');
    const textEl = document.getElementById('top-tip-text');
    const tip = computeTopTip();
    if(!tip){ el.style.display = 'none'; return; }
    textEl.textContent = tip;
    el.style.display = 'flex';
  }

  // Nooit rechtstreeks op a.name/b.name vertrouwen: één oefening zonder geldige naam
  // (bv. een import die per ongeluk een onvolledig object aanmaakte) mag nooit de hele
  // sortering — en dus de hele lijst — laten crashen. migrate() repareert zulke
  // oefeningen ook actief, maar deze guard is de laatste vangrail.
  function byName(a, b){
    const na = (a && typeof a.name === 'string') ? a.name : '';
    const nb = (b && typeof b.name === 'string') ? b.name : '';
    return na.localeCompare(nb, 'nl', {sensitivity:'base'});
  }

  // Gepinde oefeningen eerst, daarbinnen alfabetisch. Alleen gebruikt als fallback-
  // sortering (Alfabetisch-weergave) — Spiergroep en Laatst-gedaan houden bewust hun
  // eigen sortering, zie render().
  function byPinnedThenName(a, b){
    const pa = a.pinned ? 0 : 1, pb = b.pinned ? 0 : 1;
    if(pa !== pb) return pa - pb;
    return byName(a, b);
  }

  function doneToday(exId){
    const t = todayStr();
    return logsFor(exId).some(l => l.date === t);
  }

  function render(){
    renderTopTip();
    const list = document.getElementById('list');
    list.innerHTML = '';
    delete list.dataset.mode;
    if(exercises.length === 0){
      list.innerHTML = '<div class="empty">Nog geen oefeningen. Voeg er een toe hieronder.</div>';
      return;
    }

    // Sterretje is een harde filter: die geldt vóór elke weergave, ongeacht welke —
    // ook vóór een gekozen workout (zie hieronder), net als in het oude blokkensysteem.
    let base = exercises;
    if(filterPinned){
      base = base.filter(e => e.pinned);
      if(base.length === 0){
        list.innerHTML = '<div class="empty">Nog geen oefeningen met een sterretje. Tik op een ster om er een vast te zetten.</div>';
        return;
      }
    }

    // Vandaag is geen filter maar een sorteer/markeer-modifier: nog-niet-gedaan komt
    // vooraan (binnen elke groep/weergave apart) en krijgt de ✓ vandaag-markering,
    // maar niets wordt verborgen. withTodaySort() wikkelt dat vóór de bestaande
    // sorteerlogica van een weergave, zodat elke weergave 'm kan combineren.
    const markToday = filterToday;
    function withTodaySort(cmp){
      if(!markToday) return cmp;
      return (a, b) => {
        const da = doneToday(a.id) ? 1 : 0, db = doneToday(b.id) ? 1 : 0;
        if(da !== db) return da - db;
        return cmp(a, b);
      };
    }

    // Eén workout geselecteerd (dropdown, net als de oude blokken-dropdown): dit vervangt
    // de normale weergave/sortering volledig, want het hele punt is een vaste volgorde per
    // workout zien, niet alfabetisch of per spiergroep.
    if(workoutFilter){
      const w = workouts.find(x => x.id === workoutFilter);
      if(w){
        const entries = [...w.items]
          .sort((a, b) => (a.order ?? 999) - (b.order ?? 999))
          .map(it => ({ ex: base.find(e => e.id === it.exerciseId), item: it }))
          .filter(entry => entry.ex); // oefening verwijderd, maar nog als lid in de workout — defensief overslaan
        if(entries.length === 0){
          // Dit lege scherm blijft ook na een herlaad staan (de workout-keuze zit in de
          // opgeslagen voorkeuren) — zonder een duidelijke uitweg hier lijkt de hele app
          // leeg terwijl alle data gewoon nog bestaat. Daarom altijd een directe knop terug
          // naar "geen workout", niet alleen de tekstuele uitleg.
          list.innerHTML = `<div class="empty">Nog geen oefeningen in ${escapeHtml(w.name)}.<br><button class="ghost" style="margin-top:10px;" data-reset-workout-filter>← Alle oefeningen tonen</button></div>`;
          return;
        }
        // Volgorde ligt al vast via item.order (hierboven); Vandaag tilt hier alleen de
        // al-gedane oefeningen stabiel naar achteren, net als elders.
        entries.sort(markToday ? (a, b) => {
          const da = doneToday(a.ex.id) ? 1 : 0, db = doneToday(b.ex.id) ? 1 : 0;
          return da - db;
        } : () => 0);
        entries.forEach(({ex, item}) => list.appendChild(buildCard(ex, markToday, item)));
        list.dataset.mode = 'workout';
        exercises.forEach(ex => {
          if(openCards[ex.id] && document.getElementById('chart-' + ex.id)) renderChart(ex.id);
        });
        return;
      }
    }

    if(viewMode === 'boven' || viewMode === 'onder'){
      const allowed = viewMode === 'boven' ? SPLIT_UPPER : SPLIT_LOWER;
      const filtered = base.filter(e => allowed.includes(muscleCat(e)));
      if(filtered.length === 0){
        list.innerHTML = `<div class="empty">Nog geen oefeningen bij ${viewMode === 'boven' ? 'bovenlichaam' : 'onderlichaam'}.</div>`;
        return;
      }
      // Cyclus 16, hersteld cyclus 20: Bovenlichaam én Onderlichaam zijn allebei handmatig
      // herordenbaar (`upperOrder`/`lowerOrder`, los van elkaar en los van Workouts — dit
      // zijn geen workouts). De andere weergaves (Alfabetisch, Spiergroep, Laatst gedaan)
      // blijven bewust op hun vaste sortering, alleen hier bestaat een sleepvolgorde. Nog
      // niet gesleepte oefeningen vallen terug op de sterretje-dan-naam-sortering, niet weg
      // uit beeld.
      const orderField = viewMode === 'boven' ? 'upperOrder' : 'lowerOrder';
      filtered.sort(withTodaySort((a, b) => (a[orderField] ?? 999) - (b[orderField] ?? 999) || byPinnedThenName(a, b)))
        .forEach(ex => list.appendChild(buildCard(ex, markToday, null)));
      // Alleen hier (en bij een geselecteerde workout) bestaat een handmatige volgorde om
      // te herordenen — dus alleen dan worden de sleep-handvatten zichtbaar (zie CSS).
      list.dataset.mode = 'bodysplit';
      exercises.forEach(ex => {
        if(openCards[ex.id] && document.getElementById('chart-' + ex.id)) renderChart(ex.id);
      });
      return;
    }

    if(viewMode === 'spiergroep'){
      const groups = {};
      base.forEach(e => {
        const cat = muscleCat(e);
        (groups[cat] = groups[cat] || []).push(e);
      });
      MUSCLE_ORDER.forEach(cat => {
        if(!groups[cat]) return;
        const h = document.createElement('div');
        h.className = 'group-header';
        h.textContent = cat;
        list.appendChild(h);
        groups[cat].sort(withTodaySort(byName)).forEach(ex => list.appendChild(buildCard(ex, markToday, null)));
      });
    }else if(viewMode === 'laatst'){
      // Oudste laatste-sessie eerst (nog nooit gedaan telt als "oudst", dus helemaal
      // bovenaan) zodat je in één oogopslag ziet wat allang niet meer aan de beurt is
      // geweest. Vandaag laat deze volgorde met opzet ongemoeid (een net gelogde
      // oefening staat toch al onderaan) en voegt alleen de ✓-markering toe.
      const sorted = [...base].sort((a, b) => {
        const da = latestLog(a.id), db = latestLog(b.id);
        const ka = da ? da.date : '', kb = db ? db.date : '';
        if(ka !== kb) return ka.localeCompare(kb);
        return byName(a, b);
      });
      sorted.forEach(ex => list.appendChild(buildCard(ex, markToday, null)));
    }else{
      [...base].sort(withTodaySort(byPinnedThenName)).forEach(ex => list.appendChild(buildCard(ex, markToday, null)));
    }

    exercises.forEach(ex => {
      if(openCards[ex.id] && document.getElementById('chart-' + ex.id)) renderChart(ex.id);
    });
  }

  function buildCard(ex, markToday, workoutItem){
      const card = document.createElement('div');
      const isDone = markToday && doneToday(ex.id);
      card.className = 'exercise-card' + (openCards[ex.id] ? ' open' : '') + (isDone ? ' done-today' : '');
      card.dataset.exId = ex.id;

      const last = latestLog(ex.id);
      const hasTarget = ex.targetWeight != null && !isNaN(ex.targetWeight);
      const pct = pctChange(ex.id);
      const goal = (hasTarget && last) ? goalPct(ex, last.weight) : null;
      const barPct = goal != null ? goal : (pct != null ? Math.min(Math.max(pct, 0), 100) : 0);
      const pctSpan = pct != null ? `<span>${pct >= 0 ? '+' : ''}${pct.toFixed(0)}%</span>` : '';
      const progressMeta = goal != null
        ? `<span>${last.weight} / ${ex.targetWeight} kg</span>${pctSpan}`
        : pctSpan;

      card.innerHTML = `
        <div class="card-head" data-toggle="${ex.id}">
          <div class="card-title">
            <div class="name-row">
              <button class="drag-handle" data-drag-handle="${ex.id}" title="Sleep om te herordenen" aria-label="Sleep om te herordenen">⠿</button>
              <button class="star ${ex.pinned ? 'on' : ''}" data-pin="${ex.id}" title="${ex.pinned ? 'Sterretje weghalen' : 'Sterretje geven'}" aria-label="${ex.pinned ? 'Sterretje weghalen' : 'Sterretje geven'}" aria-pressed="${ex.pinned ? 'true' : 'false'}">★</button>
              <div class="name">${escapeHtml(ex.name)}</div>
            </div>
            <div class="meta">
              ${isDone ? '<span class="done-mark last-date">✓ vandaag</span>' : (last ? `<span class="last-date">${fmtDate(last.date)}</span>` : '<span class="last-date">geen sessies</span>')}
              <span class="machine-tag">${escapeHtml(categoryPillText(ex))}</span>
              ${workoutBadges(ex)}
              ${workoutItem && workoutItem.optional ? '<span class="optional-badge">optioneel</span>' : ''}
              ${progressMeta}
            </div>
            <div class="plate-bar"><div class="plate-bar-fill" style="width:${barPct}%"></div></div>
          </div>
          <div class="card-right">
            <div class="weight-now">${last ? last.weight : '–'}<span> kg</span></div>
            <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
        <div class="card-body-wrap"><div class="card-body">
          <a class="video-link" href="${videoUrlFor(ex)}" target="_blank" rel="noopener">▶ Bekijk uitleg</a>
          ${renderSuggestion(ex)}
          <canvas class="chart" id="chart-${ex.id}" height="60"></canvas>
          ${renderLogTable(ex)}
          <div class="row">
            <div class="field"><label>Datum</label><input type="date" id="in-date-${ex.id}" value="${todayStr()}"></div>
            <div class="field"><label>Gewicht (kg)</label><input type="number" step="0.5" id="in-weight-${ex.id}" value="${last ? last.weight : ''}"></div>
            <div class="field"><label>Sets</label><input type="number" id="in-sets-${ex.id}" value="${workoutItem && workoutItem.sets != null ? workoutItem.sets : ex.targetSets}"></div>
            <div class="field"><label>Reps</label><input type="number" id="in-reps-${ex.id}" value=""></div>
          </div>
          <div class="actions">
            <button class="ghost" data-delete-ex="${ex.id}">Oefening verwijderen</button>
            <button class="primary" data-save-log="${ex.id}">Sessie opslaan</button>
          </div>
          <span class="settings-toggle" data-settings-toggle="${ex.id}">instellingen (naam, toestel, spiergroep, doelen)</span>
          <div class="settings-row" id="settings-${ex.id}">
            <div class="field" style="flex:2;min-width:140px;"><label>Naam</label><input id="cfg-name-${ex.id}" value="${escapeHtml(ex.name)}"></div>
            <div class="field"><label>Toestelnr.</label><input id="cfg-machine-${ex.id}" value="${escapeHtml(ex.machine || '')}"></div>
            <div class="field"><label>Bankstand</label><input id="cfg-bench-${ex.id}" value="${escapeHtml(ex.bench || '')}" placeholder="bv. stand 3"></div>
            <div class="field"><label>Spiergroep</label><select id="cfg-category-${ex.id}">${categoryOptions(muscleCat(ex))}</select></div>
            <div class="field"><label>Specifieke spier</label><input id="cfg-label-${ex.id}" value="${escapeHtml(ex.muscleGroup || '')}" placeholder="bv. hamstrings, liezen"></div>
            <div class="field"><label>Doel reps</label><input type="number" id="cfg-reps-${ex.id}" value="${ex.targetReps}"></div>
            <div class="field"><label>Doel sets</label><input type="number" id="cfg-sets-${ex.id}" value="${ex.targetSets}"></div>
            <div class="field"><label>Stap (kg)</label><input type="number" step="0.5" id="cfg-inc-${ex.id}" value="${ex.increment}"></div>
            <div class="field"><label>Doelgewicht</label><input type="number" step="0.5" id="cfg-target-${ex.id}" value="${ex.targetWeight != null ? ex.targetWeight : ''}"></div>
            <div class="field" style="flex:2;min-width:200px;"><label>Uitleg-video (YouTube link)</label><input id="cfg-video-${ex.id}" value="${escapeHtml(ex.youtubeUrl || '')}" placeholder="https://www.youtube.com/..."></div>
            <div class="field" style="flex-direction:row;align-items:center;gap:6px;min-width:180px;">
              <input type="checkbox" id="cfg-assisted-${ex.id}" style="width:auto;" ${ex.isAssisted ? 'checked' : ''}>
              <label style="text-transform:none;font-size:12px;">Assisted (minder gewicht = beter)</label>
            </div>
            <div class="field" style="flex:1 1 100%;min-width:260px;">
              <label>Workouts</label>
              <div style="display:flex;flex-direction:column;gap:6px;margin-top:2px;">
                ${workouts.map(w => {
                  const item = w.items.find(it => it.exerciseId === ex.id);
                  return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                    <label style="display:flex;align-items:center;gap:5px;min-width:110px;text-transform:none;font-size:13px;">
                      <input type="checkbox" id="cfg-wk-${w.id}-${ex.id}" style="width:auto;" ${item ? 'checked' : ''}> ${escapeHtml(w.name)}
                    </label>
                    <input type="number" id="cfg-wk-sets-${w.id}-${ex.id}" placeholder="sets (${ex.targetSets})" value="${item && item.sets != null ? item.sets : ''}" style="width:90px;">
                    <label style="display:flex;align-items:center;gap:5px;text-transform:none;font-size:12px;color:var(--text-dim);">
                      <input type="checkbox" id="cfg-wk-opt-${w.id}-${ex.id}" style="width:auto;" ${item && item.optional ? 'checked' : ''}> optioneel
                    </label>
                  </div>`;
                }).join('')}
              </div>
            </div>
            <button class="ghost" data-save-cfg="${ex.id}" style="align-self:flex-end;">Bewaar instellingen</button>
          </div>
        </div></div>
      `;
      return card;
  }

  const SUGGESTION_ICON = { up:'↑', hold:'↻', plateau:'≈' };

  function renderSuggestion(ex){
    const s = suggestionFor(ex);
    if(!s) return '';
    return `<div class="suggestion ${s.type}"><span>${SUGGESTION_ICON[s.type] || '↑'}</span><span>${escapeHtml(s.text)}</span></div>`;
  }

  function renderLogTable(ex){
    const l = logsFor(ex.id).slice().reverse().slice(0, 8);
    if(l.length === 0) return '';
    const rows = l.map(log => {
      const pr = isPR(ex.id, log);
      const machineText = log.machine ? log.machine : (ex.machine || '–');
      const extra = log.bench || ex.bench || '';
      return `<tr>
        <td>${fmtDate(log.date)}</td>
        <td class="${pr ? 'weight-pr' : ''}">${log.weight} kg</td>
        <td>${log.sets != null ? log.sets : '–'}</td>
        <td>${log.reps != null ? log.reps : '–'}</td>
        <td>${machineText}${extra ? ' · ' + escapeHtml(extra) : ''}</td>
        <td class="row-del-cell"><button class="ghost row-del" data-delete-log="${log.id}" title="Sessie verwijderen" aria-label="Sessie verwijderen">&times;</button></td>
      </tr>`;
    }).join('');
    return `<table class="log-table">
      <tr><th>datum</th><th>gewicht</th><th>sets</th><th>reps</th><th>toestel</th><th></th></tr>
      ${rows}
    </table>`;
  }

  function renderChart(exId){
    const canvas = document.getElementById('chart-' + exId);
    if(!canvas || typeof Chart === 'undefined') return;
    const l = logsInRange(exId);
    if(l.length === 0) return;
    if(charts[exId]){ charts[exId].destroy(); }
    const ex = exercises.find(x => x.id === exId);
    const hasTarget = ex && ex.targetWeight != null && !isNaN(ex.targetWeight);
    const datasets = [{
      data: l.map(x => x.weight),
      borderColor: '#a8d94a',
      backgroundColor: 'rgba(168,217,74,0.14)',
      pointBackgroundColor: '#a8d94a',
      tension: 0.25,
      fill: true,
    }];
    if(hasTarget){
      datasets.push({
        data: l.map(() => ex.targetWeight),
        borderColor: '#9aa0ab',
        borderDash: [6, 4],
        borderWidth: 1.5,
        pointRadius: 0,
        fill: false,
        tension: 0,
      });
    }
    charts[exId] = new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: {
        labels: l.map(x => fmtDate(x.date)),
        datasets,
      },
      options: {
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1c1f26',
            titleColor: '#9aa0ab',
            bodyColor: '#ece9e2',
            borderColor: '#333844',
            borderWidth: 1,
            padding: 8,
            displayColors: false,
            callbacks: { label: (ctx) => ctx.parsed.y + ' kg' }
          }
        },
        scales: {
          x: { ticks: { color: '#9aa0ab', font:{size:10} }, grid: { color: '#242832' } },
          y: { ticks: { color: '#9aa0ab', font:{size:10} }, grid: { color: '#242832' } },
        }
      }
    });
  }

  function todayStr(){
    return new Date().toISOString().slice(0,10);
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  document.getElementById('list').addEventListener('click', async (e) => {
    // Het sleep-handvat reageert alleen op slepen (pointerdown/move/up hieronder), nooit
    // op een gewone tik — anders zou een tik op het handvat de kaart openklappen omdat
    // het handvat binnen de klikbare card-head (data-toggle) valt.
    if(e.target.closest('[data-drag-handle]')) return;
    const resetWorkoutBtn = e.target.closest('[data-reset-workout-filter]');
    if(resetWorkoutBtn){
      workoutFilter = '';
      syncControls();
      await savePrefs();
      render();
      return;
    }
    // Sterretje eerst afhandelen: de knop zit binnen de klikbare kaartkop, dus zonder
    // deze check zou het openklappen van de kaart de pin-actie opslokken.
    const pinBtn = e.target.closest('[data-pin]');
    if(pinBtn){
      const id = pinBtn.dataset.pin;
      const ex = exercises.find(x => x.id === id);
      if(ex){
        ex.pinned = !ex.pinned;
        await saveExercises();
        render();
      }
      return;
    }
    const toggle = e.target.closest('[data-toggle]');
    if(toggle){
      const id = toggle.dataset.toggle;
      openCards[id] = !openCards[id];
      render();
      return;
    }
    const settingsToggle = e.target.closest('[data-settings-toggle]');
    if(settingsToggle){
      const id = settingsToggle.dataset.settingsToggle;
      document.getElementById('settings-' + id).classList.toggle('open');
      return;
    }
    const saveLogBtn = e.target.closest('[data-save-log]');
    if(saveLogBtn){
      const id = saveLogBtn.dataset.saveLog;
      const date = document.getElementById('in-date-' + id).value || todayStr();
      const weight = parseFloat(document.getElementById('in-weight-' + id).value);
      const sets = document.getElementById('in-sets-' + id).value;
      const reps = document.getElementById('in-reps-' + id).value;
      if(isNaN(weight)){ alert('Vul een gewicht in.'); return; }
      logs.push({
        id: 'log-' + Date.now(),
        exerciseId: id,
        date,
        weight,
        sets: sets ? parseInt(sets) : null,
        reps: reps ? parseInt(reps) : null,
      });
      await saveLogs();
      render();
      openCards[id] = true;
      render();
      return;
    }
    const saveCfgBtn = e.target.closest('[data-save-cfg]');
    if(saveCfgBtn){
      const id = saveCfgBtn.dataset.saveCfg;
      const ex = exercises.find(x => x.id === id);
      const newName = document.getElementById('cfg-name-' + id).value.trim();
      if(newName) ex.name = newName;
      ex.machine = document.getElementById('cfg-machine-' + id).value.trim();
      ex.bench = document.getElementById('cfg-bench-' + id).value.trim();
      ex.youtubeUrl = document.getElementById('cfg-video-' + id).value.trim();
      ex.muscleCategory = document.getElementById('cfg-category-' + id).value;
      const newLabel = document.getElementById('cfg-label-' + id).value.trim();
      ex.muscleGroup = newLabel || MUSCLE_LABELS[ex.muscleCategory];
      ex.targetReps = parseInt(document.getElementById('cfg-reps-' + id).value) || ex.targetReps;
      ex.targetSets = parseInt(document.getElementById('cfg-sets-' + id).value) || ex.targetSets;
      ex.increment = parseFloat(document.getElementById('cfg-inc-' + id).value) || ex.increment;
      const targetRaw = document.getElementById('cfg-target-' + id).value;
      ex.targetWeight = targetRaw !== '' ? parseFloat(targetRaw) : null;
      ex.isAssisted = document.getElementById('cfg-assisted-' + id).checked;

      // Workout-lidmaatschap: per workout checken of het vinkje aan staat, en zo ja de
      // sets-override/optioneel-vlag overnemen. Een oefening toevoegen aan een workout
      // plakt 'm achteraan (hoogste order + 1); een al bestaand lid behoudt zijn eigen
      // order (die wijzig je door te slepen, niet hier). Uitvinken verwijdert het
      // lidmaatschap meteen — dit is directe bewerking in de app, geen import, dus hier
      // mag (net als vroeger bij Blok) gewoon verwijderd worden.
      let workoutsChanged = false;
      workouts.forEach(w => {
        const checked = document.getElementById(`cfg-wk-${w.id}-${id}`).checked;
        const existing = w.items.find(it => it.exerciseId === id);
        const setsRaw = document.getElementById(`cfg-wk-sets-${w.id}-${id}`).value;
        const sets = setsRaw !== '' ? parseInt(setsRaw) : null;
        const optional = document.getElementById(`cfg-wk-opt-${w.id}-${id}`).checked;
        if(checked){
          if(existing){
            if(existing.sets !== sets || existing.optional !== optional){
              existing.sets = sets;
              existing.optional = optional;
              workoutsChanged = true;
            }
          }else{
            const maxOrder = w.items.reduce((m, it) => Math.max(m, it.order || 0), 0);
            w.items.push({ exerciseId: id, order: maxOrder + 1, sets, optional });
            workoutsChanged = true;
          }
        }else if(existing){
          w.items = w.items.filter(it => it.exerciseId !== id);
          workoutsChanged = true;
        }
      });

      await saveExercises();
      if(workoutsChanged) await saveWorkouts();
      render();
      openCards[id] = true;
      render();
      return;
    }
    const delLogBtn = e.target.closest('[data-delete-log]');
    if(delLogBtn){
      const logId = delLogBtn.dataset.deleteLog;
      if(!confirm('Deze sessie verwijderen?')) return;
      const removed = logs.find(l => l.id === logId);
      logs = logs.filter(l => l.id !== logId);
      await saveLogs();
      if(removed) openCards[removed.exerciseId] = true;
      render();
      return;
    }
    const delBtn = e.target.closest('[data-delete-ex]');
    if(delBtn){
      const id = delBtn.dataset.deleteEx;
      if(!confirm('Oefening en bijbehorende sessies verwijderen?')) return;
      exercises = exercises.filter(x => x.id !== id);
      logs = logs.filter(l => l.exerciseId !== id);
      await saveExercises();
      await saveLogs();
      render();
      return;
    }
  });

  // Sleep-herordenen binnen een workout-weergave, of binnen Bovenlichaam/Onderlichaam
  // (cyclus 16, vervangen in cyclus 18 door workouts-only, cyclus 20: boven/onder weer
  // erbij naast workouts). Puur met Pointer Events, geen library: alleen het handvat (⠿)
  // start een drag, zodat de rest van de kaart gewoon tikbaar blijft om open/dicht te
  // klappen. Alleen zichtbaar/actief bij één geselecteerde workout, of bij Bovenlichaam/
  // Onderlichaam (zie render()) — geen enkele andere weergave heeft een handmatige
  // volgorde. Geen zwevende kaart/vertaling tijdens het slepen: de kaart wisselt direct
  // van plek zodra je over een buur heen sleept.
  let dragState = null;

  document.getElementById('list').addEventListener('pointerdown', (e) => {
    const handle = e.target.closest('[data-drag-handle]');
    if(!handle || (!workoutFilter && viewMode !== 'boven' && viewMode !== 'onder')) return;
    const card = handle.closest('.exercise-card');
    if(!card) return;
    e.preventDefault();
    dragState = { card, pointerId: e.pointerId };
    card.classList.add('dragging');
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  });

  document.getElementById('list').addEventListener('pointermove', (e) => {
    if(!dragState || e.pointerId !== dragState.pointerId) return;
    e.preventDefault();
    const list = document.getElementById('list');
    const all = Array.from(list.children).filter(c => c.classList.contains('exercise-card'));
    const draggedIndex = all.indexOf(dragState.card);
    for(let i = 0; i < all.length; i++){
      if(i === draggedIndex) continue;
      const sib = all[i];
      const r = sib.getBoundingClientRect();
      const mid = r.top + r.height / 2;
      if(i < draggedIndex && e.clientY < mid){ list.insertBefore(dragState.card, sib); break; }
      if(i > draggedIndex && e.clientY > mid){ list.insertBefore(dragState.card, sib.nextSibling); break; }
    }
  });

  async function endDrag(e){
    if(!dragState || (e.pointerId != null && e.pointerId !== dragState.pointerId)) return;
    dragState.card.classList.remove('dragging');
    const list = document.getElementById('list');
    const orderedIds = Array.from(list.querySelectorAll('.exercise-card')).map(c => c.dataset.exId);
    dragState = null;
    // Geen workoutFilter en geen boven/onder kan hier niet gebeuren (pointerdown gate
    // hierboven), maar defensief toch checken voor het geval de selectie tussentijds
    // wijzigde.
    if(workoutFilter){
      const w = workouts.find(x => x.id === workoutFilter);
      if(w){
        orderedIds.forEach((id, idx) => {
          const item = w.items.find(it => it.exerciseId === id);
          if(item) item.order = idx + 1;
        });
        await saveWorkouts();
      }
    }else if(viewMode === 'boven' || viewMode === 'onder'){
      const orderField = viewMode === 'boven' ? 'upperOrder' : 'lowerOrder';
      orderedIds.forEach((id, idx) => {
        const ex = exercises.find(e => e.id === id);
        if(ex) ex[orderField] = idx + 1;
      });
      await saveExercises();
    }
    render();
  }
  document.getElementById('list').addEventListener('pointerup', endDrag);
  document.getElementById('list').addEventListener('pointercancel', endDrag);

  document.getElementById('add-ex-btn').addEventListener('click', async () => {
    const name = document.getElementById('new-ex-name').value.trim();
    const machine = document.getElementById('new-ex-machine').value.trim();
    const increment = parseFloat(document.getElementById('new-ex-increment').value) || 2.5;
    const muscleCategory = document.getElementById('new-ex-category').value;
    const muscleLabel = document.getElementById('new-ex-muscle').value.trim();
    if(!name){ alert('Vul een naam in.'); return; }
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '-' + Date.now();
    exercises.push({
      id, name, machine, increment, targetReps:8, targetSets:3,
      muscleCategory,
      muscleGroup: muscleLabel || MUSCLE_LABELS[muscleCategory],
      isAssisted:false, targetWeight:null,
    });
    await saveExercises();
    document.getElementById('new-ex-name').value = '';
    document.getElementById('new-ex-machine').value = '';
    document.getElementById('new-ex-increment').value = '2.5';
    document.getElementById('new-ex-muscle').value = '';
    document.getElementById('new-ex-category').value = 'borst';
    render();
  });

  document.getElementById('view-mode').addEventListener('change', async (e) => {
    viewMode = e.target.value;
    await savePrefs();
    render();
  });

  document.getElementById('filter-today').addEventListener('change', async (e) => {
    filterToday = e.target.checked;
    await savePrefs();
    render();
  });

  document.getElementById('filter-pinned').addEventListener('change', async (e) => {
    filterPinned = e.target.checked;
    await savePrefs();
    render();
  });

  document.getElementById('workout-filter').addEventListener('change', async (e) => {
    workoutFilter = e.target.value;
    await savePrefs();
    render();
  });

  document.getElementById('range-mode').addEventListener('change', async (e) => {
    rangeMode = e.target.value;
    // Bij de eerste keer "Aangepast" een zinnig startpunt voorstellen (6 maanden terug)
    // in plaats van een leeg datumveld dat stilletjes als "vanaf het begin" werkt.
    if(rangeMode === 'custom' && !customFrom){
      const d = new Date(todayStr() + 'T00:00:00');
      d.setMonth(d.getMonth() - 6);
      customFrom = d.toISOString().slice(0,10);
    }
    syncControls();
    await savePrefs();
    render();
  });

  document.getElementById('range-from').addEventListener('change', async (e) => {
    customFrom = e.target.value;
    await savePrefs();
    render();
  });

  document.getElementById('export-btn').addEventListener('click', () => {
    const payload = {
      exportedAt: todayStr(),
      exercises,
      logs,
      workouts,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ijzerlog-export-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('import-btn').addEventListener('click', () => {
    document.getElementById('import-file').click();
  });

  document.getElementById('import-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = ''; // zelfde bestand later opnieuw kunnen kiezen
    if(!file) return;

    let data;
    try{
      const text = await file.text();
      data = JSON.parse(text);
    }catch(err){
      alert('Kon het bestand niet lezen: geen geldig JSON-bestand.');
      return;
    }

    const plan = buildImportPlan(data);
    if(plan.errors && plan.errors.length && !plan.newExercises){
      alert('Import mislukt:\n' + plan.errors.join('\n'));
      return;
    }

    const summary = describeImportPlan(plan);
    const warnings = plan.errors.length ? '\n\nLet op:\n' + plan.errors.join('\n') : '';
    if(!confirm('Dit importbestand bevat:\n\n' + summary + warnings + '\n\nDoorgaan?')) return;

    applyImportPlan(plan);
    await saveExercises();
    await saveLogs();
    const workoutsTouched = plan.newWorkouts.length + plan.updatedWorkouts.length;
    if(workoutsTouched) await saveWorkouts();
    syncControls();
    render();
    setStatus('Import verwerkt: ' + plan.newExercises.length + ' nieuw, ' + plan.updatedExercises.length + ' bijgewerkt, ' + plan.newLogs.length + ' sessie(s) toegevoegd' + (workoutsTouched ? ', ' + workoutsTouched + ' workout(s) gewijzigd.' : '.'));
  });

  document.getElementById('new-ex-category').innerHTML = categoryOptions('borst');

  loadAll();
})();
</script>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registratie mislukt', err));
    });
  }
</script>

</body>
